const GEO_LAT_MIN=6, GEO_LAT_MAX=38, GEO_LNG_MIN=68, GEO_LNG_MAX=98;
function isValidIndiaCoords(lat, lng){
  const la=parseFloat(lat), lo=parseFloat(lng);
  return !isNaN(la)&&!isNaN(lo)&&isFinite(la)&&isFinite(lo)&&
    la>=GEO_LAT_MIN&&la<=GEO_LAT_MAX&&lo>=GEO_LNG_MIN&&lo<=GEO_LNG_MAX;

// ── PASSWORD HASHING (SubtleCrypto SHA-256) ───────────────────────────────────

// auth — rotate the DEFAULT_API_KEY and restrict Sheet access for full security.
async function hashPassword(pw){
  try{
    const enc=new TextEncoder().encode(pw);
    const buf=await crypto.subtle.digest("SHA-256",enc);
    const hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    return "sha256:"+hex;
  }catch(_){
    // SubtleCrypto unavailable (non-HTTPS) — fall back to plaintext (no regression)
    return pw;
  }
}
async function verifyPassword(input, stored){
  if(!stored) return false;
  if(stored.startsWith("sha256:")){
    const hashed=await hashPassword(input);
    return hashed===stored;
  }
  // Legacy plaintext — direct compare, will be upgraded on next save
  return input===stored;
}
async function upgradePasswordIfNeeded(userObj, plaintextPw){
  if(userObj.password && !userObj.password.startsWith("sha256:")){
    const hashed=await hashPassword(plaintextPw);
    userObj.password=hashed;
    save(DB);

    const isCors = e instanceof TypeError;
    if(!isCors) throw e;
    console.warn("VIBE: direct fetch blocked, retrying via CORS proxy…");
  }
  const proxied = CORS_PROXY + encodeURIComponent(fullUrl);
  const ctrl2 = new AbortController();
  const t2 = setTimeout(()=>ctrl2.abort(), timeout);
  const res2 = await fetch(proxied, { method:"GET", redirect:"follow", signal: ctrl2.signal });
  clearTimeout(t2);
  return res2;
}

async function gsFetch(params) {
  const url = getScriptUrl();
  if (!url) return null;
  const fullParams = { ...params, key: getApiKey(), user: SESSION ? SESSION.username : "anonymous" };
  const getUrl = url + "?" + new URLSearchParams(fullParams);

  try {
    const res = await _corsSafeFetch(getUrl, { method: "GET", redirect: "follow" }, 10000);
    const text = await res.text();
    try {
      const json = JSON.parse(text);
      if (json && json.error && String(json.error).toLowerCase().includes("rate limit")) {
        console.warn("GS: Rate limit hit — backing off");
        return { ok: false, rateLimited: true };
      }
      if (json && json.ok) return json;
      if (json && json.params) {
        console.warn("GS GET: server echoed params — retrying as POST");
      } else {
        return json;
      }
    } catch(e) {
      console.warn("GS GET: non-JSON response, retrying as POST");
    }
  } catch(e) { console.warn("GS GET error", e); }

  try {
    const ctrl2 = new AbortController();
    const tmr2 = setTimeout(() => ctrl2.abort(), 10000);
    const res2 = await fetch(url, {
      method: "POST", redirect: "follow",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ ...fullParams, apiKey: getApiKey() }),
      signal: ctrl2.signal
    });
    clearTimeout(tmr2);
    const text2 = await res2.text();
    try { return JSON.parse(text2); } catch(e) {
      console.error("GS POST fallback: non-JSON response");
      return null;
    }
  } catch(e) { console.error("GS POST fallback error", e); return null; }
}

// Replaces all alert() calls — non-blocking, auto-dismiss, stackable
function showToast(msg, type="info", duration=4000){
  // type: "info" | "success" | "warn" | "error"
  const colors={
    info:   {bg:"#4f8ef7", text:"#fff"},
    success:{bg:"#38d9a9", text:"#052e1c"},
    warn:   {bg:"#ffd166", text:"#1a1200"},
    error:  {bg:"#ff5f6d", text:"#fff"}
  };
  const {bg, text}=colors[type]||colors.info;

  // Stack toasts vertically — find existing ones and shift
  const existing=document.querySelectorAll(".vibe-toast");
  const offset=existing.length*60;

  const t=document.createElement("div");
  t.className="vibe-toast";
  t.style.cssText=[
    "position:fixed",
    "bottom:"+(1.5+offset/16)+"rem",
    "left:50%",
    "transform:translateX(-50%)",
    "background:"+bg,
    "color:"+text,
    "padding:.7rem 1.3rem",
    "border-radius:12px",
    "font-weight:700",
    "font-size:.85rem",
    "z-index:9999",
    "box-shadow:0 4px 20px #00000044",
    "font-family:'Sora',sans-serif",
    "max-width:90vw",
    "text-align:center",
    "transition:opacity .3s,transform .3s",
    "cursor:pointer",
    "line-height:1.4"
  ].join(";");
  t.textContent=msg;

  // Tap to dismiss
  t.addEventListener("click",()=>dismiss());
  document.body.appendChild(t);

  function dismiss(){
    t.style.opacity="0";
    t.style.transform="translateX(-50%) translateY(8px)";
    setTimeout(()=>{ t.remove(); repositionToasts(); },320);
  }

  function repositionToasts(){
    document.querySelectorAll(".vibe-toast").forEach((el,i)=>{
      el.style.bottom=(1.5+i*3.75)+"rem";
    });
  }

  const timer=setTimeout(dismiss, duration);
  t.addEventListener("click",()=>clearTimeout(timer),{once:true});
  return t;
}

async function gsPost(body) {
  const url = getScriptUrl();
  if (!url) return { ok: false, error: "No Script URL" };
  const secureBody = { ...body, apiKey: getApiKey(), username: body.username || (body.data && body.data.username) || (SESSION ? SESSION.username : "") };
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 10000);
    const res = await fetch(url, { method:"POST", redirect:"follow", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(secureBody), signal:ctrl.signal });
    clearTimeout(t);
    const text = await res.text();
    try { return JSON.parse(text); } catch(_) { return { ok: true }; }
  } catch(e) {
    console.warn("gsPost direct failed, trying proxy GET fallback:", e.message);
  }
  try {
    const getUrl = url + "?" + new URLSearchParams({ ...secureBody, key: getApiKey() });

// Track which dates absences have already been posted this session
const _absPostedDates = new Set();
let _absRunning = false;

async function markAbsences() {
  // ANTI-DUPLICATE LOCK: only one run at a time
  if (_absRunning) return;
  _absRunning = true;
  try {
    // SERVER TIME FIX: use server time for all "today" logic
    const _sNow=getServerNow();
    const today = new Date(_sNow);
    const todayStr = localDateStr(today);
    // IST day-of-week and hour from server time
    const _todayIstMin=Math.floor((_sNow/60000)+(5*60+30));
    const _todayIstH=Math.floor(((_todayIstMin%1440)+1440)%1440/60);
    const _todayIstDow=new Date(todayStr+"T00:00:00+05:30").getDay();
    if (_todayIstDow === 0) return; // skip Sunday
    if (_todayIstH < 10 || _todayIstH > 21) return; // only run 10AM-9PM IST

    if (!DB.absences) DB.absences = [];

    // ANTI-DUPLICATE: Always reload from sheet first to get latest absences
    try {
      const loaded = await loadFromSheet();
      if (!loaded) {
        console.warn("markAbsences: sheet unreachable, skipping this cycle");
        return;
      }
    } catch(e) {
      console.warn("markAbsences: sheet unreachable, skipping", e);
      return;
    }

    const checkedInToday = new Set(
      DB.attendance
        .filter(r => (r.type === "in" || r.type === "out") && localDateStr(new Date(r.timestamp)) === todayStr)
        .map(r => r.username)
    );
    const surveyedToday = new Set(
      (DB.surveys||[])
        .filter(s => s.date === todayStr)
        .map(s => s.username)
    );

    // Build set of usernames that already have an absence record in the sheet for today
    const alreadyAbsentInSheet = new Set(
      DB.absences
        .filter(a => a.date === todayStr)
        .map(a => String(a.username||"").toLowerCase())
    );

    const usersToPost = [];
    DB.users.filter(u => u.role !== "admin").forEach((u, idx) => {
      const uname = String(u.username||"").toLowerCase();
      const isPresent = checkedInToday.has(uname) || surveyedToday.has(uname);
      const existsInSheet = alreadyAbsentInSheet.has(uname);

      if (isPresent && existsInSheet) {
        // User checked in — remove their absence
        DB.absences = DB.absences.filter(a => String(a.username||"").toLowerCase() !== uname || a.date !== todayStr);
        gsPost({ action:"removeAbsence", data:{ username: u.username, date: todayStr } }).catch(()=>{});
      } else if (!isPresent && !existsInSheet) {
        // ANTI-DUPLICATE: only add if truly not in sheet AND not already posted this session
        const sessionKey = uname + "__" + todayStr;
        if (!_absPostedDates.has(sessionKey)) {
          usersToPost.push({ u, idx });
          _absPostedDates.add(sessionKey);
        }
      }
    });

    // Post absences in ONE batch call instead of N separate calls
    if (usersToPost.length > 0) {
      const newAbsences = usersToPost.map(({u, idx}) => ({
        id: String(getServerNow())+"_abs_"+idx,
        username: u.username,
        date: todayStr,
        auto: true
      }));
      // Add to local DB first
      newAbsences.forEach(a => DB.absences.push(a));
      save(DB);
      // Send as batch to reduce API calls
      try {
        await gsPost({ action: "addAbsences", data: newAbsences });
      } catch(_) {
        // Fallback: individual posts
        for (const a of newAbsences) {
          gsPost({ action: "addAbsence", data: a }).catch(()=>{});
        }
      }
      console.log("markAbsences: posted", newAbsences.length, "absences for", todayStr);
    }
  } finally {
    _absRunning = false;
  }
}

async function syncToSheet() {

    const uname = (u.username||"").toLowerCase();

    const cleanLoc = (!u.location||u.location.toLowerCase()===uname) ? "" : u.location;
    // Only write real India coords — reject anything that isn't a valid number in India range
    const rawLat = parseFloat(u.geoLat); const rawLng = parseFloat(u.geoLng);
    const validGeo = isValidIndiaCoords(rawLat, rawLng);
    const cleanGeoLat = validGeo ? String(rawLat) : "";

    const rawRad = parseInt(u.geoRadius);
    const cleanGeoRad = (!isNaN(rawRad)&&rawRad>=50&&rawRad<=5000) ? rawRad : 200;
    // OfficeName: reject if it's a role value, a number/coordinate, or the username
    const rawOff = String(u.officeName||"").trim();
    const offIsNum = !isNaN(parseFloat(rawOff)) && isFinite(rawOff);
    const cleanOfficeName = (!rawOff||ROLE_VALUES.has(rawOff.toLowerCase())||offIsNum||rawOff.toLowerCase()===uname) ? "" : rawOff;
    return {...u, designation:cleanDesig, location:cleanLoc, geoLat:cleanGeoLat, geoLng:cleanGeoLng, geoRadius:cleanGeoRad, officeName:cleanOfficeName};
  });
  const payload = {
    action:"syncData",
    apiKey: getApiKey(),
    username: SESSION ? SESSION.username : "admin",
    data: { surveys: DB.surveys, attendance: DB.attendance, absences: DB.absences, officeLocations: DB.officeLocations }
  };
  try {
    const _sc = new AbortController();
    const _st = setTimeout(() => _sc.abort(), 8000);
    const res = await fetch(_syncUrl, { method:"POST", redirect:"follow", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(payload), signal: _sc.signal });
    clearTimeout(_st);
    const text = await res.text();
    try { return JSON.parse(text); } catch { return { ok: true }; }
  } catch(e) {
    console.warn("syncToSheet failed:", e);
    return { ok: false, error: e.message };
  }
}

let _loadRunning = false;
async function loadFromSheet() {
  if (!getScriptUrl()) return false;
  _loadRunning = true;
  try {
    const result = await gsFetch({ action:"getAll" });
    if (!result) return false;
    if (result.rateLimited) { console.warn("loadFromSheet: rate limited, skipping"); return false; }
    if (!result.ok) return false;

    const safeString = (val, fallback = "") => {
      if (val === null || val === undefined) return fallback;
      if (typeof val === 'function') return fallback;
      return String(val).trim();
    };
    const safeChain = (...vals) => {
      for (let v of vals) {
        const s = safeString(v, null);
        if (s) return s;
      }
      return "";
    };

    const sheetUsers = (result.users||[]).map(u => {
        // Sheet columns: username | password | fullName | designation | location | role | geoLat | geoLng | geoRadius | officeName
        const ROLE_VALUES = new Set(["user","admin","team leader","teamleader","manager","staff"]);
        const uname = safeString(u.username, "");
        const fname = safeChain(u.fullName, u.full_name, u.FullName, u.name);

        // ── COORDINATE DETECTION HELPERS ──────────────────────────────────────
        // Checks all geo-related columns to find where the real coords ended up,
        // regardless of column shift. Uses shared GEO_LAT/LNG bounds constants.
        const isIndiaLat = v => { const n=parseFloat(v); return !isNaN(n)&&isFinite(n)&&n>=GEO_LAT_MIN&&n<=GEO_LAT_MAX; };
        const isIndiaLng = v => { const n=parseFloat(v); return !isNaN(n)&&isFinite(n)&&n>=GEO_LNG_MIN&&n<=GEO_LNG_MAX; };
        const isRadius   = v => { const n=parseInt(v);   return !isNaN(n)&&n>=50&&n<=5000; };
        const isRoleVal  = v => ROLE_VALUES.has(safeString(v,"").toLowerCase());
        const isUserName = v => safeString(v,"").toLowerCase()===uname.toLowerCase();

        // Collect all 5 right-side column values in order
        const cols = [
          safeString(u.designation,""),
          safeString(u.location,""),
          safeString(u.role,""),
          safeString(u.geoLat,""),
          safeString(u.geoLng,""),
          safeString(u.geoRadius,""),
          safeString(u.officeName,"")
        ];
        // des=cols[0], loc=cols[1], role=cols[2], geoLat=cols[3], geoLng=cols[4], geoRad=cols[5], officeName=cols[6]

        // Find lat: first value in cols[2..6] that looks like India latitude
        // Find lng: first value AFTER lat position that looks like India longitude
        let latIdx=-1, lngIdx=-1;
        for(let i=2;i<cols.length;i++){ if(isIndiaLat(cols[i])){latIdx=i;break;} }
        for(let i=(latIdx>=0?latIdx+1:3);i<cols.length;i++){ if(isIndiaLng(cols[i])){lngIdx=i;break;} }

        const finalGeoLat  = latIdx>=0 ? String(parseFloat(cols[latIdx])) : "";
        const finalGeoLng  = lngIdx>=0 ? String(parseFloat(cols[lngIdx])) : "";

        // Radius: look for a valid radius value that is NOT the lat or lng position
        let finalGeoRad = 200;
        for(let i=2;i<cols.length;i++){
          if(i===latIdx||i===lngIdx) continue;
          if(isRadius(cols[i])){ finalGeoRad=parseInt(cols[i]); break; }
        }

        // Role: use cols[2] if it's a real role, else fallback
        const rawRole    = cols[2];
        const cleanRole  = ROLE_VALUES.has(rawRole.toLowerCase()) ? rawRole.toLowerCase() : "user";

        // OfficeName: any non-empty non-role non-coord non-username text in cols[3..6] outside lat/lng/rad positions
        let finalOfficeName = "";
        for(let i=3;i<cols.length;i++){
          if(i===latIdx||i===lngIdx) continue;
          const v=cols[i].trim();
          if(!v||isRoleVal(v)||isUserName(v)||isIndiaLat(v)||isIndiaLng(v)||isRadius(v)) continue;
          if(!isNaN(parseFloat(v))&&isFinite(v)) continue; // skip any number
          finalOfficeName=v; break;
        }

        // Designation: cols[0], but clear if it equals username or fullName (corrupt)
        const rawDesig = cols[0];
        const cleanDesig = (!rawDesig||rawDesig.toLowerCase()===uname.toLowerCase()||rawDesig.toLowerCase()===(fname||uname).toLowerCase()||isRoleVal(rawDesig)) ? "" : rawDesig;

        // Location: cols[1], but clear if it equals username (corrupt)
        const rawLoc = cols[1];
        const cleanLoc = (!rawLoc||rawLoc.toLowerCase()===uname.toLowerCase()||isRoleVal(rawLoc)) ? "" : rawLoc;

        return {
          username:    uname,
          password:    safeString(u.password, ""),
          fullName:    fname,
          userId:      safeChain(u.userId, u.user_id, u.UserId, uname),
          designation: cleanDesig,
          location:    cleanLoc,
          role:        cleanRole,
          geoLat:      finalGeoLat,
          geoLng:      finalGeoLng,
          geoRadius:   finalGeoRad,
          officeName:  finalOfficeName
        };
      }).filter(u => u.username);

    if (sheetUsers.length) {
      // GEO FIX: snapshot localStorage BEFORE DB is overwritten — used as last-resort
      // fallback so a stale Sheet fetch can never erase a freshly saved geofence.
      const localSnap = {};
      try { const _r=localStorage.getItem(KEY); if(_r){(JSON.parse(_r).users||[]).forEach(u=>{localSnap[u.username]=u;});} } catch(_){}

      const localAdmins = DB.users.filter(u => u.role === "admin" && !sheetUsers.find(s => s.username === u.username));
      const merged = sheetUsers.map(su => {
        const local = DB.users.find(x => x.username === su.username);
        const snap  = localSnap[su.username];
        return {
          ...su,
          geoLat:     su.geoLat     || local?.geoLat     || snap?.geoLat     || "",
          geoLng:     su.geoLng     || local?.geoLng     || snap?.geoLng     || "",
          geoRadius:  su.geoRadius  || local?.geoRadius  || snap?.geoRadius  || 200,
          officeName: su.officeName || local?.officeName || snap?.officeName || ""
        };
      });
      DB.users = [...merged, ...localAdmins];
    }

    if (SESSION) {
      const sessionUser = DB.users.find(u => u.username === SESSION.username);
      if (sessionUser) {
        if (sessionUser.fullName && sessionUser.fullName.trim()) SESSION.fullName = sessionUser.fullName.trim();
      }
    }

    const safeParseFloat = (val, fallback = 0) => {
      const num = parseFloat(val);
      return isNaN(num) ? fallback : num;
    };

    const sheetAttend = (result.attendance||[]).map(r => {
      const lat = safeParseFloat(r.lat), lng = safeParseFloat(r.lng);
      const outLat = safeParseFloat(r.outLat), outLng = safeParseFloat(r.outLng);
      const validLoc = (r.lat && r.lng && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) ? {lat, lng, workLocation: safeString(r.workLocation, "")} : null;
      const validOutLoc = (r.outLat && r.outLng && outLat >= -90 && outLat <= 90 && outLng >= -180 && outLng <= 180) ? {lat: outLat, lng: outLng} : null;
      const rType = safeString(r.type, "").toLowerCase();
      const localRec = r.id ? DB.attendance.find(x => x.id && String(x.id) === String(r.id)) : null;
      const inferredType = rType || localRec?.type || "in";
      const geoOk = r.geoOk === true || r.geoOk === "true" || r.geoOk === 1 || r.geoOk === "1";
      // Timestamp fallback: if raw timestamp is 0/missing, try parsing a date string
      let ts = parseInt(r.timestamp)||0;
      if (!ts && r.date) { try { ts = new Date(String(r.date).slice(0,10)+"T09:00:00").getTime()||0; } catch(_){} }
      return {
        id: safeString(r.id, ""),
        username: safeString(r.username, "").toLowerCase(),
        type: inferredType,
        timestamp: ts,
        location: validLoc,
        outLocation: validOutLoc,
        outTimestamp: parseInt(r.outTimestamp)||0,
        geoOk,
        geoName: safeString(r.geoName, ""),
        geoDist: r.geoDist!=null ? parseInt(r.geoDist)||0 : null
      };
    }).filter(r => r.username && r.timestamp);

    const byUserDay = {};
    sheetAttend.forEach(r => {
      const key = r.username + "__" + localDateStr(new Date(r.timestamp));
      if(!byUserDay[key]) byUserDay[key] = [];
      byUserDay[key].push(r);
    });

    // DATE FIX: keep all records — do not drop check-ins based on timestamp ordering.
    // Previous logic dropped check-ins that appeared "after" checkout (due to +1ms offset
    // on checkout records and timezone edge cases), causing entire days to disappear.
    // Now we simply keep every record that has a matching check-in on the same day.
    // Orphan outs (checkout with no same-day check-in) are kept too — never drop data.
    const cleanedAttend = [];
    Object.values(byUserDay).forEach(recs => {
      // Always keep all records in a day group — both ins and outs
      recs.forEach(r => cleanedAttend.push(r));
    });
    DB.attendance = cleanedAttend;

    // DEBUG: log raw counts from sheet to help diagnose empty data
    console.log("VIBE loadFromSheet: raw counts — users:", (result.users||[]).length, "attendance:", (result.attendance||[]).length, "surveys:", (result.surveys||[]).length, "absences:", (result.absences||[]).length);

    const sheetSurveys = (result.surveys||[]).map(s => {
      const ts = parseInt(s.timestamp)||0;
      let d = "";
      try {
        if (ts) {
          d = localDateStr(new Date(ts));
        } else {
          d = safeString(s.date, "").slice(0,10);
        }
      } catch (e) {
        d = safeString(s.date, "").slice(0,10);
      }
      if(!d) return null;
      return { id: safeString(s.id, ""), username: safeString(s.username, "").toLowerCase(), date: d, timestamp: ts, policy: parseInt(s.policy)||0, rsa: parseInt(s.rsa)||0, gpa: parseInt(s.gpa)||0 };
    }).filter(s => s && s.username && s.date);

    const surveyMap = {};
    sheetSurveys.forEach(s => {
      const key = s.username + "__" + s.date;
      const existing = surveyMap[key];
      if (!existing) { surveyMap[key] = s; }
      else {
        const existTotal = existing.policy + existing.rsa + existing.gpa;
        const newTotal = s.policy + s.rsa + s.gpa;
        if (newTotal > existTotal || (newTotal === existTotal && s.timestamp > existing.timestamp)) surveyMap[key] = s;
      }
    });
    DB.surveys = Object.values(surveyMap);

    const sheetAbsences = (result.absences||[]).map(a => {
      return {
        id: safeString(a.id, ""), 
        username: safeString(a.username, ""), 
        date: safeString(a.date, "").slice(0,10), 
        auto: a.auto||false
      };
    }).filter(a => a.username && a.date);
    DB.absences = sheetAbsences;

    // Case-insensitive username matching — sheet usernames may be UPPERCASE, DB stores lowercase
    const activeUsernames = new Set(DB.users.map(u => u.username.toLowerCase()));
    DB.absences  = DB.absences.filter(a  => activeUsernames.has(String(a.username  ||"").toLowerCase()));
    DB.surveys   = DB.surveys.filter(s   => activeUsernames.has(String(s.username  ||"").toLowerCase()));
    DB.attendance= DB.attendance.filter(r=> activeUsernames.has(String(r.username  ||"").toLowerCase()));
    // Normalise all usernames to lowercase so dashboard comparisons always work
    DB.surveys   = DB.surveys.map(s   =>({...s,   username: String(s.username  ||"").toLowerCase()}));
    DB.attendance= DB.attendance.map(r =>({...r,   username: String(r.username  ||"").toLowerCase()}));
    DB.absences  = DB.absences.map(a  =>({...a,   username: String(a.username  ||"").toLowerCase()}));

    // Persist fresh data to localStorage so next load shows data instantly
    try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(_) {}
    return true;
  } catch(e) { console.error("loadFromSheet error:", e); return false; }
  finally { _loadRunning = false; }
}

// ── GEOFENCE HELPERS ──────────────────────────────────────────────────────────
function haversineDistance(lat1,lng1,lat2,lng2){
  const R=6371000,toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function checkUserGeofence(userLat,userLng,username){
  const u=DB.users.find(x=>x.username===username);
  if(u){
    // Trim and check — sheet may return whitespace strings or "0"
    const rawLat=String(u.geoLat||"").trim();
    const rawLng=String(u.geoLng||"").trim();
    if(rawLat && rawLng && rawLat!=="0" && rawLng!=="0"){
      const lat=parseFloat(rawLat), lng=parseFloat(rawLng);
      // Validate realistic coordinates (India range) and minimum radius
      const validCoords=isValidIndiaCoords(lat,lng);
      const radius=parseInt(u.geoRadius)||200;
      const validRadius=radius>=50; // ignore tiny/corrupt radius values
      if(validCoords&&validRadius){
        const d=haversineDistance(userLat,userLng,lat,lng);
        const name=String(u.officeName||u.location||"").trim();
        return{ok:d<=radius,name,dist:Math.round(d),radius,noLocationSet:false};
      }
    }
  }
  // No valid location set → allow freely, no block
  return{ok:true,name:"",dist:null,radius:200,noLocationSet:true};
}

const WORK_START_H=9,WORK_START_M=0;
const WORK_END_H=18,WORK_END_M=0;
const FULL_DAY_MIN=8*60;
const HALF_DAY_MIN=4*60;
const HALF_DAY_LATE_MIN=4*60;

function getArrivalStatus(tsMs){
  if(!tsMs)return null;
  const d=new Date(tsMs);
  // IST FIX: always compute hours/minutes in IST (UTC+5:30)
  const istOffset=5*60+30;
  const istTotalMin=Math.floor((tsMs/60000)+istOffset);
  const inMin=((istTotalMin%1440)+1440)%1440;
  const startMin=WORK_START_H*60+WORK_START_M;
  const lateMin=inMin-startMin;
  if(lateMin<=0)return{type:"ontime",label:"On Time"};
  if(lateMin>=HALF_DAY_LATE_MIN)return{type:"halfday",label:"Half Day"};
  const lh=Math.floor(lateMin/60),lm=lateMin%60;
  return{type:"late",label:lh>0?(lm>0?`${lh}h ${lm}m Late`:`${lh}h Late`):`${lm}m Late`};
}
function getDepartureStatus(tsMs, checkInTs){
  if(!tsMs)return null;
  if(!checkInTs){
    // IST FIX: always compute hours/minutes in IST (UTC+5:30)
    const istOffset=5*60+30;
    const istTotalMin2=Math.floor((tsMs/60000)+istOffset);
    const outMin=((istTotalMin2%1440)+1440)%1440;
    const endMin=WORK_END_H*60+WORK_END_M;
    return outMin<endMin?{type:"permission",label:"Permission"}:{type:"full",label:"Full Day"};
  }
  const workedMs=tsMs-checkInTs;
  const workedMin=Math.round(workedMs/60000);
  if(workedMin>=FULL_DAY_MIN) return{type:"full",label:"Full Day"};
  if(workedMin>=HALF_DAY_MIN) return{type:"permission",label:"Permission"};
  const wh=Math.floor(workedMin/60),wm=workedMin%60;
  return{type:"permission",label:wh>0?(wm>0?`${wh}h ${wm}m`:`${wh}h`):(`${wm}m`)};
}
function localMonthStr(date){

    // IST FIX: always return YYYY-MM in IST (UTC+5:30), consistent with localDateStr()
    return d.toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"}).slice(0,7);
  }catch(_){
    const d=date||new Date();
    return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }
}

// ── SERVER TIME v20260321 — IST-forced, CORS-proxy fallback ──────────────────
// Always fetches IST time from trusted APIs. Uses CORS proxy if direct fetch blocked.
// NEVER falls back silently to device clock — returns trusted:false so check-in is blocked.
const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000; // UTC+5:30

async function _timeFetch(url, timeout=6000){
  // Try direct first, then via CORS proxy
  try{
    const ctrl=new AbortController();
    setTimeout(()=>ctrl.abort(),timeout);
    return await fetch(url,{method:"GET",signal:ctrl.signal});
  }catch(_){}
  // CORS proxy fallback
  const ctrl2=new AbortController();
  setTimeout(()=>ctrl2.abort(),timeout);
  return await fetch(CORS_PROXY+encodeURIComponent(url),{method:"GET",signal:ctrl2.signal});
}

async function getServerTime(){
  // ✅ FIX: Return cached time if recently fetched (prevent API hammering on concurrent calls)
  if(_serverNow && Date.now()-_serverNowFetchedAt<1500){
    const drift=_serverNow-Date.now();
    return{serverMs:_serverNow,drift,trusted:true};
  }
  
  // All APIs return true UTC milliseconds (unix epoch).
  // localDateStr() and fmtIST() then convert to IST for display/comparison.
  const apis=[
    // API 1: timeapi.io — request IST zone, parse dateTime as IST string
    async()=>{
      const t0=Date.now();
      const res=await _timeFetch("https://timeapi.io/api/Time/current/zone?timeZone=Asia%2FKolkata");
      const json=await res.json();
      // ✅ FIX #7: Validate response type and structure
      if(!json || typeof json.dateTime !== 'string') throw new Error("Invalid dateTime response");
      if(json.dateTime.length < 19) throw new Error("dateTime too short");
      // dateTime is "2026-03-21T12:29:00.000" — this is IST local time with NO offset suffix.
      // We MUST append +05:30 so JS parses it as IST, not as device-local or UTC.
      const istStr=json.dateTime.replace(/(\.\d+)?$/, "+05:30");
      const serverMs=Math.round(new Date(istStr).getTime()+((Date.now()-t0)/2));
      if(isNaN(serverMs)) throw new Error("invalid");
      return serverMs;
    },
    // API 2: worldtimeapi — unixtime is always UTC epoch, no parsing ambiguity
    async()=>{
      const t0=Date.now();
      const res=await _timeFetch("https://worldtimeapi.org/api/timezone/Asia/Kolkata");
      const json=await res.json();
      if(!json.unixtime) throw new Error("no unixtime");
      return Math.round((json.unixtime*1000)+((Date.now()-t0)/2));
    },
    // API 3: Google Apps Script — ts is UTC epoch ms from Date.now() server-side
    async()=>{
      const t0=Date.now();
      const res=await _timeFetch(getScriptUrl()+"?action=getTime&key="+getApiKey());
      const j=await res.json();
      if(!j||!j.ts) throw new Error("no ts");
      const serverMs=Math.round(parseInt(j.ts)+((Date.now()-t0)/2));
      if(isNaN(serverMs)) throw new Error("invalid");
      return serverMs;
    }
  ];
  for(const api of apis){
    try{
      const serverMs=await api();
      const drift=Math.round(serverMs-Date.now());
      cacheServerTime(serverMs); // update global server time cache
      const istTime=new Date(serverMs).toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",hour12:true});
      const istDate=new Date(serverMs).toLocaleDateString("en-IN",{timeZone:"Asia/Kolkata"});
      console.log("VIBE: server time OK — IST: "+istDate+" "+istTime+", drift="+Math.round(drift/1000)+"s");
      return{serverMs,drift,trusted:true};
    }catch(e){ console.warn("VIBE time API failed:",e.message); }
  }
  console.error("VIBE: ALL time APIs failed — check-in will be blocked");
  return{serverMs:Date.now(),drift:0,trusted:false};
}

// ── SERVER TIME CACHE ────────────────────────────────────────────────────────
// _serverNow: cached server UTC ms, refreshed on login and each check-in/out.
// All "today" logic uses this instead of Date.now() / new Date().
let _serverNow = null; // null = not yet fetched
let _serverNowFetchedAt = 0; // Date.now() when last fetched
// ✅ FIX #4: Debounce to prevent duplicate check-in/out records from rapid clicks
let _checkInInProgress = false;
let _checkOutInProgress = false;

// Returns best-estimate current server time in ms.
// Uses cached value + elapsed time since fetch (so it ticks forward correctly).
function getServerNow(){
  if(_serverNow && _serverNowFetchedAt){
    return _serverNow + (Date.now() - _serverNowFetchedAt);
  }
  // Not yet fetched — fall back to device clock (will be corrected on next fetch)
  return Date.now();
}

// Call this after every successful getServerTime() to update the cache.
function cacheServerTime(serverMs){
  _serverNow = serverMs;
  _serverNowFetchedAt = Date.now();
}

// Convenience: today's date string in IST using server time
function serverTodayStr(){
  return localDateStr(new Date(getServerNow()));
}

function checkClockDate(serverMs, trusted=true){

  if(serverDate !== deviceDate){

    return `Your device date is <strong>${deviceD}</strong> but the actual date is <strong>${serverD}</strong>. Please fix your device date and try again.`;

}
// Check if device time is outside any plausible working window (5AM-11PM)
// Used as a safety net when server time APIs are unreachable
function checkDeviceDateSanity(){
  // IST FIX: check hour in IST timezone
  const nowIstMin=Math.floor((Date.now()/60000)+(5*60+30));
  const h=Math.floor(((nowIstMin%1440)+1440)%1440/60);
  if(h<5||h>=23){

    const deviceT=new Date().toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",hour12:true});
    return `Your device shows <strong>${deviceD} ${deviceT}</strong> which is outside working hours. Could not verify with time server. Please check your device date & time.`;
  }
  return null;
}

// ── LOCATION (Fix: capture GPS hardware timestamp for cross-check) ────────────
function getLocation(){
  return new Promise((res)=>{
    if(!navigator.geolocation){res({error:"unsupported"});return;}
    navigator.geolocation.getCurrentPosition(
      p=>{
        const lat=p.coords.latitude,lng=p.coords.longitude;
        if(lat<-90||lat>90||lng<-180||lng>180){res({error:"unavailable"});return;}
        // p.timestamp is the GPS hardware timestamp (ms since epoch) — capture it for drift check
        res({lat,lng,gpsTs:p.timestamp||null});
      },
      (err)=>{ if(err.code===1)res({error:"denied"}); else if(err.code===3)res({error:"timeout"}); else res({error:"unavailable"}); },
      {timeout:12000,enableHighAccuracy:true,maximumAge:0}
    );
  });
}

function h(tag,attrs,children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object"){Object.assign(el.style,v)}
    else if(k.startsWith("on")&&typeof v==="function"){el.addEventListener(k.slice(2).toLowerCase(),v)}
    else if(k==="className"){el.className=v}
    else if(k==="htmlFor"){el.htmlFor=v}
    else if(typeof v==="boolean"){if(v)el.setAttribute(k,"");else el.removeAttribute(k);}
    else{el.setAttribute(k,v)}
  });
  if(children){(Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null||c===false||c===undefined)return;
    el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  })}
  return el;
}

    <div style="font-size:.85rem;font-weight:700;letter-spacing:.18em;color:#94a3b8;text-transform:uppercase;margin-top:.2rem;text-align:center">Attendance</div>
  `;
  const sub=el("div","subtitle","Sign in to mark your attendance");
  const errBox=el("div","alert alert-error hidden","");
  const lbU=h("label",{},"Username");
  const inU=h("input",{type:"text",placeholder:"Enter username",autocomplete:"username"});
  const lbP=h("label",{},"Password");
  const pwWrap=h("div",{style:{position:"relative",marginBottom:"1.2rem"}});
  const inP=h("input",{type:"password",placeholder:"Enter password",autocomplete:"current-password"});
  inP.style.marginBottom="0";inP.style.paddingRight="3rem";
  const eyeBtn=h("button",{type:"button",style:{position:"absolute",right:".75rem",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"var(--muted)",fontSize:"1.1rem",padding:"0",lineHeight:"1"}},"👁");
  let pwVisible=false;
  eyeBtn.addEventListener("click",()=>{pwVisible=!pwVisible;inP.type=pwVisible?"text":"password";eyeBtn.textContent=pwVisible?"🙈":"👁"});
  pwWrap.appendChild(inP);pwWrap.appendChild(eyeBtn);
  const btn=h("button",{className:"btn btn-primary"},"Sign In");

  let _loginAttempts=0;
  let _loginLockedUntil=0;
  function doLogin(){
    const u=inU.value.trim(),p=inP.value.trim();
    errBox.classList.add("hidden");
    if(!u||!p){errBox.textContent="Please enter username and password.";errBox.classList.remove("hidden");return}
    // Brute force protection: lock after 5 failed attempts for 60 seconds
    const now=Date.now();
    if(_loginLockedUntil>now){
      const secsLeft=Math.ceil((_loginLockedUntil-now)/1000);
      errBox.textContent=`Too many failed attempts. Please wait ${secsLeft}s before trying again.`;
      errBox.classList.remove("hidden");return;
    }
    btn.disabled=true;btn.textContent="Verifying…";
    (async()=>{
      try{
        await loadFromSheet();
      }catch(_){}
      let found=null;
      for(const x of DB.users){
        if(x.username===u && await verifyPassword(p, x.password)){ found=x; break; }
      }
      if(!found && DB.users.filter(x=>x.role==="admin").length===0){
        const defUser=def().users.find(x=>x.username===u&&x.password===p);
        if(defUser) found=defUser;
      }
      if(!found){
        _loginAttempts++;
        if(_loginAttempts>=5){
          _loginLockedUntil=Date.now()+60000;
          _loginAttempts=0;
          errBox.textContent="Too many failed attempts. Locked for 60 seconds.";
        } else {
          errBox.textContent=`Incorrect username or password. (${5-_loginAttempts} attempts left)`;
        }
        errBox.classList.remove("hidden");
        btn.disabled=false;btn.textContent="Sign In";return;
      }
      _loginAttempts=0;_loginLockedUntil=0;
      // Transparently upgrade plaintext password to SHA-256 hash on successful login
      upgradePasswordIfNeeded(found, p).catch(()=>{});
      proceedLogin(found,u,p);
    })();
  }

  function withLoginTimeout(promise, ms=6000){
    return Promise.race([promise, new Promise(res=>setTimeout(()=>res(false), ms))]);
  }

  function proceedLogin(found, u, p){
    if(found.role==="admin"){
      SESSION={username:found.username,fullName:found.fullName&&found.fullName.trim()?found.fullName.trim():found.username,role:"admin"};
      saveSession(SESSION);
      route();
      return;
    }
    if(!navigator.onLine){
      errBox.textContent="No internet connection. Please connect to the internet and try again.";
      errBox.classList.remove("hidden");
      btn.disabled=false;btn.textContent="Sign In";
      return;
    }
    // ── CLOCK MISMATCH CHECK AT LOGIN ────────────────────────────────────────
    // Fetch server time and compare with device clock.
    // If drift > 5 minutes, block login to prevent wrong timestamps on check-in/out.
    btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Verifying clock…';
    (async()=>{
      const st=await getServerTime();
      if(st.trusted){
        // Check date mismatch first (device set to wrong day)
        const dateErr=checkClockDate(st.serverMs,true);
        if(dateErr){
          errBox.innerHTML=`📅 <strong>Device date is wrong.</strong><br>${dateErr}`;
          errBox.classList.remove("hidden");
          btn.disabled=false;btn.textContent="Sign In";
          return;
        }
        // Check time mismatch (device clock >5 min off)
        const driftMin=Math.abs(st.drift)/60000;
        if(driftMin>5){
          const deviceTime=new Date().toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",hour12:true});
          const serverTime=new Date(st.serverMs).toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",hour12:true});
          errBox.innerHTML=`⏰ <strong>Device clock is wrong.</strong><br>Your device shows <strong>${deviceTime}</strong> but the actual time is <strong>${serverTime}</strong>.<br><span style="font-size:.85em">Please fix your device clock and try again.</span>`;
          errBox.classList.remove("hidden");
          btn.disabled=false;btn.textContent="Sign In";
          return;
        }
      } else {
        // Server unreachable — run device sanity check
        const sanityErr=checkDeviceDateSanity();
        if(sanityErr){
          errBox.innerHTML=`⚠️ <strong>Could not verify device time.</strong><br>${sanityErr}`;
          errBox.classList.remove("hidden");
          btn.disabled=false;btn.textContent="Sign In";
          return;
        }
      }
      const fn=found.fullName&&found.fullName.trim()?found.fullName.trim():found.username.charAt(0).toUpperCase()+found.username.slice(1).toLowerCase();
      SESSION={username:found.username,fullName:fn,role:"user"};
      saveSession(SESSION);
      sessionStorage.removeItem("vibeLastCheckout_"+SESSION.username);
      route();
    })();
  }
  btn.addEventListener("click",doLogin);
  [inU,inP].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()}));
  [logo,sub,errBox,lbU,inU,lbP,pwWrap,btn].forEach(x=>card.appendChild(x));
  wrap.appendChild(card);render(wrap);
}

    const inp=h("input",{type:"number",min:"0",placeholder});
    inp.style.marginBottom="0";
    wrap.appendChild(ql);wrap.appendChild(inp);
    return{wrap,inp};
  }
  const {wrap:w1,inp:i1}=field("📜 Today's Policy Count","q-policy","e.g. 5");
  const {wrap:w2,inp:i2}=field("🔐 Today's RSA Count","q-rsa","e.g. 3");
  const {wrap:w3,inp:i3}=field("🎓 Today's GPA Count","q-gpa","e.g. 2");
  const submitBtn=h("button",{className:"btn btn-primary",disabled:true,style:{marginTop:".5rem"}},"Please fill all 3 fields");
  function checkFill(){
    const ok=i1.value.trim()!==""&&i2.value.trim()!==""&&i3.value.trim()!=="";
    submitBtn.disabled=!ok;submitBtn.textContent=ok?"✓ Submit & Check Out":"Please fill all 3 fields";
  }
  [i1,i2,i3].forEach(i=>{i.addEventListener("input",checkFill);i.addEventListener("change",checkFill);});
  submitBtn.addEventListener("click",()=>{
    // ✅ FIX #6: Trim input values for consistency
    const p=parseInt(i1.value.trim())||0, r=parseInt(i2.value.trim())||0, g=parseInt(i3.value.trim())||0;
    // ✅ FIX #8: Warn about ANY zero entries, not just all zeros
    const zeros=[];
    if(p===0) zeros.push("Policy");
    if(r===0) zeros.push("RSA");
    if(g===0) zeros.push("GPA");
    if(zeros.length>0){
      if(!confirm(`No entries for: ${zeros.join(", ")}. Continue anyway?`)) return;
    }
    onSubmit({policy:p,rsa:r,gpa:g});overlay.remove();
  });
  [xBtn,title,sub,w1,w2,w3,submitBtn].forEach(x=>modal.appendChild(x));
  overlay.appendChild(modal);
  overlay.addEventListener("click",e=>{if(e.target===overlay){overlay.remove();if(onCancel)onCancel();}});
  document.body.appendChild(overlay);
}

function renderUser(){
  if(!SESSION||!SESSION.username){renderLogin();return;}
  // DATE CHECK on every render — catches restored sessions that bypass login
  // Run async so it doesn't block render, but check-in button will also validate
  (async()=>{
    const st=await getServerTime();
    if(st.trusted){
      const dateErr=checkClockDate(st.serverMs);
      if(dateErr){
        // Force sign out — session was restored with wrong date device
        SESSION=null;clearSession();
        renderLogin();
        // Show error after login renders
        setTimeout(()=>{
          const errBox=document.querySelector(".alert-error");
          if(errBox){errBox.innerHTML=`?? <strong>Device date is wrong.</strong><br>${dateErr}`;errBox.classList.remove("hidden");}
        },100);
      }

  if(window._adminPollInterval){clearInterval(window._adminPollInterval);window._adminPollInterval=null;}
  if(window._adminPollTimeout){clearTimeout(window._adminPollTimeout);window._adminPollTimeout=null;}
  if(window._adminBadgeInterval){clearInterval(window._adminBadgeInterval);window._adminBadgeInterval=null;}
  window._adminRefresh=null; window._doAdminSync=null;
  const myRecs=()=>DB.attendance.filter(r=>r.username===SESSION.username).sort((a,b)=>b.timestamp-a.timestamp);
  const todayRecs=()=>{
    const s=serverTodayStr(); // SERVER TIME FIX
    const recs=myRecs().filter(r=>localDateStr(new Date(r.timestamp))===s);
    const sessionCheckoutTs=parseInt(sessionStorage.getItem("vibeLastCheckout_"+SESSION.username)||"0");
    const outs=recs.filter(r=>r.type==="out");
    const lastOutTs=outs.length?Math.max(...outs.map(r=>r.timestamp)):0;
    const cutoff=Math.max(sessionCheckoutTs,lastOutTs);
    if(!cutoff)return recs;
    return recs.filter(r=>{
      if(r.type==="out")return true;
      if(r.timestamp<cutoff)return true;         // strictly before cutoff (was <=, causing bug)
      if(r.timestamp-cutoff>5*60*1000)return true;
      return false;
    });
  };
  const isIn=()=>{
    const t=todayRecs();
    const sessionCheckoutTs=parseInt(sessionStorage.getItem("vibeLastCheckout_"+SESSION.username)||"0");
    if(sessionCheckoutTs){
      const ins=t.filter(r=>r.type==="in"&&r.timestamp>sessionCheckoutTs);
      return ins.length>0;
    }
    if(!t.length)return false;
    const outs=t.filter(r=>r.type==="out");
    const ins=t.filter(r=>r.type==="in");
    if(!ins.length)return false;
    if(!outs.length)return true;
    const lastOutTs=Math.max(...outs.map(r=>r.timestamp));
    const lastInTs=Math.max(...ins.map(r=>r.timestamp));
    return lastInTs>lastOutTs;
  };
  const dash=el("div","dash");

  tbR.appendChild(document.createTextNode(displayName+" "));
  tbR.appendChild(el("span","badge badge-green","User"));
  const soBtn=h("button",{className:"btn btn-ghost btn-sm",style:{marginLeft:".5rem"}},"Sign Out");
  soBtn.addEventListener("click",()=>{
    window._userRefresh=null;window._calMonth=null;
    delete window._recQuick;delete window._recUser;delete window._recMonth;

    delete window._adminGeoLat;delete window._adminGeoLng;

    if(SESSION) sessionStorage.removeItem("vibeLastCheckout_"+SESSION.username);
    SESSION=null;clearSession();route();
  });
  const refBtn=h("button",{className:"btn btn-ghost btn-sm"},"🔄 Refresh");
  refBtn.addEventListener("click",async()=>{
    refBtn.disabled=true;refBtn.textContent="⏳ Syncing…";
    await loadFromSheet();
    const u2r=DB.users.find(x=>x.username===SESSION.username);if(u2r&&u2r.fullName&&u2r.fullName.trim())SESSION.fullName=u2r.fullName.trim();
    refBtn.textContent="✅ Done";
    setTimeout(()=>{refBtn.textContent="🔄 Refresh";refBtn.disabled=false;},2000);
    refresh();
  });
  tbR.appendChild(refBtn);tbR.appendChild(soBtn);
  const themeBtn=h("button",{className:"btn btn-ghost btn-sm",style:{fontSize:"1rem",padding:".35rem .6rem",marginLeft:".25rem"}},document.body.classList.contains("light-mode")?"🌙":"☀️");
  themeBtn.title="Toggle light/dark mode";
  themeBtn.addEventListener("click",()=>{
    const isLight=document.body.classList.toggle("light-mode");

  tbR.appendChild(themeBtn);
  tb.appendChild(tbR);dash.appendChild(tb);

  const meUserProfile=DB.users.find(u=>u.username===SESSION.username);
  const profileCard=h("div",{style:{background:"var(--card)",borderBottom:"1px solid var(--border)",padding:"1rem 1.5rem",display:"flex",alignItems:"center",gap:"1rem"}});
  const initials=(displayName||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const avatar=h("div",{style:{width:"44px",height:"44px",borderRadius:"50%",background:"linear-gradient(135deg,var(--accent),var(--accent2))",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"900",fontSize:"1rem",color:"#fff",flexShrink:"0"}},initials);
  const profileInfo=h("div",{style:{flex:"1",minWidth:0}});

  profileInfo.appendChild(pName);
  const pMeta=h("div",{style:{display:"flex",gap:".4rem",flexWrap:"wrap",marginTop:".25rem",alignItems:"center"}});
  if(meUserProfile?.designation){
    pMeta.appendChild(h("span",{style:{fontSize:".72rem",background:"#4f8ef722",color:"var(--accent)",border:"1px solid #4f8ef744",borderRadius:"6px",padding:".15rem .5rem",fontWeight:"700"}},meUserProfile.designation));

  const content=el("div","content");

  let curTab="today";

  // IST FIX: compute current month in IST

  const curMonthKey=_nowIstStr.slice(0,7); // YYYY-MM
  let selMonth=curMonthKey;
  let _checkoutInProgress=false;

  function refresh(){
    window._userRefresh=refresh;
    _checkoutInProgress=false; // BUG5 FIX: safety reset in case flag got stuck
    content.innerHTML="";
    const allRecs=myRecs();
    const totalDays=[...new Set(allRecs.filter(r=>r.type==="in").map(r=>localDateStr(new Date(r.timestamp))))].length;
    const nowS=new Date();
    // IST FIX: compute current month in IST
    const _nowSIstStr=nowS.toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
    const curMKS=_nowSIstStr.slice(0,7);
    const mySurveys=(DB.surveys||[]).filter(s=>s.username===SESSION.username);
    const normD=d=>{if(!d)return"";const s=String(d);return s.includes("T")?s.slice(0,10):s.slice(0,10);}
    const monthSurveysU=mySurveys.filter(s=>normD(s.date).startsWith(curMKS));
    const monthPolicyU=monthSurveysU.reduce((s,r)=>s+(parseInt(r.policy)||0),0);
    const monthRsaU=monthSurveysU.reduce((s,r)=>s+(parseInt(r.rsa)||0),0);
    const monthGpaU=monthSurveysU.reduce((s,r)=>s+(parseInt(r.gpa)||0),0);
    // FIXED: Compute absent days directly from attendance data — do NOT rely on DB.absences
    // which only gets populated if markAbsences() ran (requires admin after 10:30 AM).
    // Instead, enumerate every working day in current month up to yesterday and check for check-in.
    const absentDays=(()=>{
      // SERVER TIME FIX: use server date for "today" comparison
      const today=new Date(getServerNow());
      const year=parseInt(curMKS.split("-")[0]);
      const month=parseInt(curMKS.split("-")[1])-1;

      const todayIST=serverTodayStr();
      const todayISTDay=parseInt(todayIST.split("-")[2])||today.getDate();
      const lastDay=Math.min(daysInMonth, todayISTDay);
      // Build set of dates user checked in or submitted a survey this month
      const presentDates=new Set([
        ...allRecs.filter(r=>r.type==="in").map(r=>localDateStr(new Date(r.timestamp))),
        ...(DB.surveys||[]).filter(s=>s.username===SESSION.username).map(s=>s.date)
      ]);
      let count=0;
      for(let d=1;d<=lastDay;d++){
        const dateStr=curMKS+"-"+String(d).padStart(2,"0");
        // IST FIX: compute day-of-week using UTC to avoid timezone shift
        const dow=new Date(dateStr+"T00:00:00+05:30").getDay();
        if(dow===0) continue; // skip Sunday only (Saturday is a working day)
        if(dateStr===serverTodayStr()) continue; // SERVER TIME FIX: don't count today
        if(!presentDates.has(dateStr)) count++;
      }
      return count;
    })();
    const monthLblU=nowS.toLocaleString("en-IN",{timeZone:"Asia/Kolkata",month:"long",year:"numeric"});

    const grid=el("div","grid2",null,{marginBottom:".8rem"});

    if(curTab==="today"){
      const todayIn=todayRecs().find(r=>r.type==="in");

      const checkedIn=isIn();

          showToast("⏳ Check-out already in progress...","warn",2000);
          return;

        if(!checkedIn && _checkInInProgress){
          showToast("⏳ Check-in already in progress...","warn",2000);
          return;
        }
        if(checkedIn) _checkOutInProgress=true;
        else _checkInInProgress=true;
        
        // Original handler begins...
        try {
        if(checkedIn){
          if(_checkoutInProgress||!isIn()||!canCheckOut()){refresh();return;}
          if(!navigator.onLine){
            _checkOutInProgress=false;
            const oldEb=content.querySelector(".loc-err-banner");if(oldEb)oldEb.remove();
            const eb=h("div",{className:"loc-err-banner geo-banner geo-warn",style:{marginTop:".75rem"}});
            eb.innerHTML="<span class='geo-icon'>📡</span><div><strong>No Internet Connection</strong><br>Please connect to the internet to check out.</div>";
            mainBtn.insertAdjacentElement("afterend",eb);
            return;
          }
          _checkoutInProgress=true;
          mainBtn.disabled=true;mainBtn.textContent="Opening survey…";
          showSurvey(answers=>{
            mainBtn.textContent="Verifying time…";
            // Wrap entire async chain so _checkoutInProgress always resets on any error
            (async()=>{
            try{
            const _stOut=await getServerTime();
            // ── CLOCK MISMATCH CHECK (checkout) ─────────────────────────────
            if(_stOut.trusted){
              const dateErrCo=checkClockDate(_stOut.serverMs,true);
              if(dateErrCo){
                _checkoutInProgress=false;_lastCheckOut=0;
                mainBtn.disabled=false;mainBtn.textContent="⏹ Check Out";
                const oldEbCo=content.querySelector(".loc-err-banner");if(oldEbCo)oldEbCo.remove();
                const ebCo=h("div",{className:"loc-err-banner geo-banner geo-fail",style:{marginTop:".75rem"}});
                ebCo.innerHTML=`<span class='geo-icon'>📅</span><div><strong>❌ Check Out Blocked — Device Date Wrong</strong><br>${dateErrCo}<br><span style='font-size:.85em'>Go to phone Settings → Date & Time → enable Auto date & time, then try again.</span></div>`;
                mainBtn.insertAdjacentElement("afterend",ebCo);
                return;
              }
              const driftMin=Math.abs(_stOut.drift)/60000;
              if(driftMin>5){
                _checkoutInProgress=false;_lastCheckOut=0;
                mainBtn.disabled=false;mainBtn.textContent="⏹ Check Out";
                const oldEbCo2=content.querySelector(".loc-err-banner");if(oldEbCo2)oldEbCo2.remove();
                const ebCo2=h("div",{className:"loc-err-banner geo-banner geo-fail",style:{marginTop:".75rem"}});
                const deviceTimeCo=new Date().toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",hour12:true});
                const serverTimeCo=new Date(_stOut.serverMs).toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",hour12:true});
                ebCo2.innerHTML=`<span class='geo-icon'>⏰</span><div><strong>❌ Check Out Blocked — Phone Clock is Wrong</strong><br>Your phone shows <strong>${deviceTimeCo}</strong> but actual time is <strong>${serverTimeCo}</strong>.<br><span style='font-size:.85em'>Go to Settings → Date & Time → enable <strong>Auto date & time</strong>, then try again.</span></div>`;
                mainBtn.insertAdjacentElement("afterend",ebCo2);
                return;
              }
            }
            mainBtn.textContent="Checking out…";
            const loc=await getLocation();
              if(loc && loc.error){
                _checkoutInProgress=false;

      allM.forEach(m=>{const o=h("option",{value:m},new Date(m+"-01").toLocaleString("default",{month:"long",year:"numeric"}));if(m===selMonth)o.selected=true;sel.appendChild(o)});
      sel.addEventListener("change",()=>{selMonth=sel.value;refresh()});
      bar.appendChild(lbl);bar.appendChild(sel);content.appendChild(bar);

      const mRecs=myRecs().filter(r=>{const d=new Date(r.timestamp);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`===selMonth});
      const mSurveys=(DB.surveys||[]).filter(s=>s.username===SESSION.username&&s.date&&s.date.startsWith(selMonth));
      const g3=el("div","grid3",null,{marginBottom:"1.2rem"});
      const policySum=mSurveys.reduce((s,r)=>s+(parseInt(r.policy)||0),0);
      const rsaSum=mSurveys.reduce((s,r)=>s+(parseInt(r.rsa)||0),0);
      const gpaSum=mSurveys.reduce((s,r)=>s+(parseInt(r.gpa)||0),0);
      [["policy","📜 Policy",policySum],["rsa","🔐 RSA",rsaSum],["gpa","🎓 GPA",gpaSum]].forEach(([cls,lbl,v])=>{
        const b=el("div","stat-box "+cls);b.innerHTML=`<div class="num">${v}</div><div class="lbl">${lbl} Total</div>`;g3.appendChild(b);
      });
      content.appendChild(g3);

      const dayMap={};
      mRecs.filter(r=>r.type==="in").forEach(r=>{
        const k=localDateStr(new Date(r.timestamp));
        if(!dayMap[k])dayMap[k]={date:new Date(r.timestamp),in:null,out:null,loc:null,outLoc:null,inRec:null,outRec:null};
        if(!dayMap[k].in||r.timestamp<dayMap[k].in){
          dayMap[k].in=r.timestamp;dayMap[k].loc=r.location;dayMap[k].inRec=r;
          if(r.outLocation&&!dayMap[k].outLoc){
            dayMap[k].outLoc=r.outLocation;
            if(!dayMap[k].outRec)dayMap[k].outRec={username:r.username,location:r.outLocation,geoName:r.geoName||"",geoOk:r.geoOk||false,geoDist:r.geoDist??null};
          }
          if(r.outTimestamp&&!dayMap[k].out)dayMap[k].out=r.outTimestamp;
        }
      });
      mRecs.filter(r=>r.type==="out").forEach(r=>{
        const outKey=localDateStr(new Date(r.timestamp));
        const target=dayMap[outKey]||null;
        if(!target)return;
        if(!target.out||r.timestamp>target.out){target.out=r.timestamp;target.outLoc=r.location||r.outLocation||null;target.outRec=r;}
      });
      const days=Object.values(dayMap).sort((a,b)=>b.date-a.date);
      const st1=el("div","section-title",`Attendance — ${new Date(selMonth+"-01").toLocaleString("default",{month:"long",year:"numeric"})}`);
      content.appendChild(st1);
      if(!days.length){content.appendChild(el("div","empty","No attendance for this month."))}
      else{
        const tw=h("div",{style:{overflowX:"auto",background:"var(--card)",borderRadius:"12px",border:"1px solid var(--border)"}});
        const tbl=el("table","month-table");
        tbl.innerHTML=`<thead><tr><th>Date</th><th>Check In</th><th>Check Out</th><th>⏰ Arrival</th><th>🚪 Departure</th><th>📍 In Location</th><th>📍 Out Location</th></tr></thead>`;
        const tb2=document.createElement("tbody");
        days.forEach(d=>{
          const tr2=document.createElement("tr");
          const mins=d.in&&d.out?Math.round((d.out-d.in)/60000):null;
          const hrs=mins?`${Math.floor(mins/60)}h ${mins%60}m`:"—";
          const hrsVal=mins?mins/60:null;
          const hrsColor=!mins?"var(--muted)":hrsVal>=8?"var(--gpa)":hrsVal>=4?"var(--warn)":"var(--danger)";
          const hrsBg=!mins?"transparent":hrsVal>=8?"#38d9a922":hrsVal>=4?"#ffd16622":"#ff5f6d22";
          const hrsBorder=!mins?"transparent":hrsVal>=8?"#38d9a944":hrsVal>=4?"#ffd16644":"#ff5f6d44";
          const arr=getArrivalStatus(d.in);
          const dep=getDepartureStatus(d.out, d.in);
          const arrCell=arr?`<span class="timing-pill tp-${arr.type}">${arr.label}</span>`:"—";
          const depCell=dep?`<span class="timing-pill tp-${dep.type==="full"?"ontime":dep.type}">${dep.label}</span>`:"—";
          const geoRec=d.inRec||myRecs().find(r=>r.type==="in"&&r.timestamp===d.in);
          const inLoc=d.loc||(geoRec?.location)||null;
          // Office name: from geoName on record, else from user's officeName/location profile
          const _meU=DB.users.find(x=>x.username===SESSION.username);
          const _profileOfficeName=(_meU?.officeName&&_meU.officeName.trim())?_meU.officeName.trim():((_meU?.location&&_meU.location.trim())?_meU.location.trim():"");
          function _geoLabel(rec, fallback){
            if(rec?.geoName&&rec.geoName!=="No office location set"&&rec.geoName!=="") return rec.geoName;
            return fallback||"";
          }
          function _locCell(loc, rec, textColor){
            if(!loc?.lat) return `<span style="color:var(--muted);font-size:.75rem">—</span>`;
            const name=_geoLabel(rec, _profileOfficeName);
            const coords=`${parseFloat(loc.lat).toFixed(4)}, ${parseFloat(loc.lng).toFixed(4)}`;
            // Distance badge helper
            function _dBadgeU(d, isOut){
              const dLbl=d>=1000?(d/1000).toFixed(1)+"km":d+"m";
              const dColor=isOut?"#ff5f6d":"#38d9a9";
              const dBg=isOut?"#ff5f6d22":"#38d9a922";
              const dBorder=isOut?"#ff5f6d44":"#38d9a944";
              return `<span style="font-size:.65rem;font-weight:700;padding:.1rem .4rem;border-radius:20px;background:${dBg};color:${dColor};border:1px solid ${dBorder}">${isOut?"⚠️":"✅"} ${dLbl} from office</span>`;
            }
            let distBadge="";
            const _rawDistU=rec?.geoDist;
            const _hasDistU=_rawDistU!=null&&_rawDistU!==""&&String(_rawDistU).trim()!=="";
            if(_hasDistU){
              // Saved distance from check-in (most accurate)
              distBadge=_dBadgeU(parseInt(_rawDistU)||0, !rec.geoOk);
            } else if(_meU?.geoLat&&_meU?.geoLng){
              // Calculate from user's configured office coords
              const oLat=parseFloat(_meU.geoLat),oLng=parseFloat(_meU.geoLng);
              const d=Math.round(haversineDistance(parseFloat(loc.lat),parseFloat(loc.lng),oLat,oLng));
              const radius=parseInt(_meU.geoRadius)||200;
              distBadge=_dBadgeU(d, d>radius);
            }
            return `<div style="display:flex;flex-direction:column;gap:3px">
              ${name?`<span style="font-size:.75rem;font-weight:700;color:${textColor}">🏢 ${escapeHtml(name)}</span>`:""}
              <a href="https://maps.google.com/?q=${loc.lat},${loc.lng}" target="_blank"
                style="font-size:.7rem;font-family:var(--mono);color:var(--muted);text-decoration:none;opacity:.8">📍 ${coords}</a>
              ${distBadge}
            </div>`;
          }
          let inGeoName=_geoLabel(geoRec, _profileOfficeName);
          const inGeoCell=_locCell(inLoc, geoRec, "var(--accent2)");
          const outLoc=d.outLoc||(d.outRec?.location)||null;
          let outGeoName=_geoLabel(d.outRec, _profileOfficeName);
          const outGeoCell=_locCell(outLoc, d.outRec, "var(--danger)");
          tr2.innerHTML=`<td style="font-family:var(--mono);font-size:.8rem">${d.date.toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short"})}</td>
            <td style="color:var(--accent2);font-family:var(--mono);font-size:.82rem">${d.in?fmtIST(d.in):"—"}</td>
            <td style="color:var(--danger);font-family:var(--mono);font-size:.82rem">${d.out?fmtIST(d.out):"—"}</td>
            <td>${arrCell}</td>
            <td>${depCell}</td>
            <td>${inGeoCell}</td>
            <td>${outGeoCell}</td>`;
          tb2.appendChild(tr2);
        });
        tbl.appendChild(tb2);tw.appendChild(tbl);content.appendChild(tw);
      }

      if(mSurveys.length){
        const st2=el("div","section-title","Survey Responses");content.appendChild(st2);
        const tw2=h("div",{style:{overflowX:"auto",background:"var(--card)",borderRadius:"12px",border:"1px solid var(--border)"}});
        const tbl2=el("table","month-table");
        tbl2.innerHTML=`<thead><tr><th>Date</th><th>📜 Policy</th><th>🔐 RSA</th><th>🎓 GPA</th></tr></thead>`;
        const tb3=document.createElement("tbody");
        [...mSurveys].sort((a,b)=>b.timestamp-a.timestamp).forEach(s=>{
          const tr3=document.createElement("tr");
          tr3.innerHTML=`<td style="font-family:var(--mono);font-size:.8rem">${s.date}</td>
            <td><span class="pill pill-pend">${s.policy??0}</span></td>
            <td><span class="pill pill-yes">${s.rsa??0}</span></td>
            <td><span class="pill pill-gpa">${s.gpa??0}</span></td>`;
          tb3.appendChild(tr3);
        });
        tbl2.appendChild(tb3);tw2.appendChild(tbl2);content.appendChild(tw2);
      }
    }

    if(curTab==="calendar"){
      if(!window._calMonth)window._calMonth=curMKS;
      const calNav=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1rem"}});
      const prevBtn=h("button",{className:"btn btn-ghost btn-sm"},"◀");
      const nextBtn=h("button",{className:"btn btn-ghost btn-sm"},"▶");
      const calTitle=h("div",{style:{fontWeight:"700",fontSize:"1rem",color:"var(--text)"}},
        new Date(window._calMonth+"-01").toLocaleString("default",{month:"long",year:"numeric"}));
      prevBtn.addEventListener("click",()=>{
        const d=new Date(window._calMonth+"-01");d.setMonth(d.getMonth()-1);
        window._calMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;refresh();});
      nextBtn.addEventListener("click",()=>{
        const d=new Date(window._calMonth+"-01");d.setMonth(d.getMonth()+1);
        window._calMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;refresh();});
      if(window._calMonth>=curMKS) nextBtn.disabled=true;
      calNav.appendChild(prevBtn);calNav.appendChild(calTitle);calNav.appendChild(nextBtn);
      content.appendChild(calNav);

      const calRecs=myRecs().filter(r=>{const d=new Date(r.timestamp);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`===window._calMonth});
      const calDayMap={};
      calRecs.forEach(r=>{
        const k=localDateStr(new Date(r.timestamp));
        if(!calDayMap[k])calDayMap[k]={in:null,out:null};
        if(r.type==="in"&&(!calDayMap[k].in||r.timestamp<calDayMap[k].in)){
          calDayMap[k].in=r.timestamp;
          // Also capture outTimestamp embedded in check-in row (some sheet layouts store both in one row)
          if(r.outTimestamp&&(!calDayMap[k].out||r.outTimestamp>calDayMap[k].out)) calDayMap[k].out=r.outTimestamp;
        }
        if(r.type==="out"&&(!calDayMap[k].out||r.timestamp>calDayMap[k].out)) calDayMap[k].out=r.timestamp;
      });
      // FIX: Mark a day as "full day" (green) if the user submitted a survey for that date
      // (survey is only submitted at checkout, so its presence = full checkout happened)
      const calSurveyDates=new Set((DB.surveys||[]).filter(s=>s.username===SESSION.username&&(s.date||"").startsWith(window._calMonth)).map(s=>s.date));
      calSurveyDates.forEach(date=>{
        if(!calDayMap[date])calDayMap[date]={in:null,out:null};
        if(!calDayMap[date].out) calDayMap[date].out=1; // sentinel: survey = checked out
      });
      // FIX: Compute absent dates on-the-fly instead of relying on DB.absences
      // DB.absences only gets written if admin was logged in after 10:30 AM — unreliable.
      const calAbsent=(()=>{
        const s=new Set();
        const todayStr=serverTodayStr(); // SERVER TIME FIX
        const calParts=(window._calMonth||"").split("-");
        if(calParts.length<2)return s;
        const cy=parseInt(calParts[0]),cm=parseInt(calParts[1])-1;
        const dim=new Date(cy,cm+1,0).getDate();
        for(let d=1;d<=dim;d++){
          const ds=window._calMonth+"-"+String(d).padStart(2,"0");
          if(ds>=todayStr)continue; // skip today and future
          const dow=new Date(cy,cm,d).getDay();
          if(dow===0)continue; // skip Sunday
          if(!calDayMap[ds])s.add(ds);
        }
        return s;
      })();

      const parts = (window._calMonth || "").split("-");
      if (parts.length < 2) return;
      const calYear=parseInt(parts[0]);
      const calMonthIdx=parseInt(parts[1])-1;
      if (isNaN(calYear) || isNaN(calMonthIdx)) return;
      const firstDay=new Date(calYear,calMonthIdx,1).getDay();
      const daysInMonth=new Date(calYear,calMonthIdx+1,0).getDate();
      const todayDateStr=serverTodayStr(); // SERVER TIME FIX

      const calWrap=h("div",{style:{background:"var(--card)",borderRadius:"14px",border:"1px solid var(--border)",padding:"1rem"}});
      const dayHeaders=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px",marginBottom:"4px"}});
      ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{
        dayHeaders.appendChild(h("div",{style:{textAlign:"center",fontSize:".7rem",fontWeight:"700",color:"var(--muted)",padding:".3rem 0"}},d));
      });
      calWrap.appendChild(dayHeaders);

      const calGrid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px"}});
      for(let i=0;i<firstDay;i++) calGrid.appendChild(h("div",{}));

      for(let day=1;day<=daysInMonth;day++){
        const dateStr=`${window._calMonth}-${String(day).padStart(2,"0")}`;
        const dayData=calDayMap[dateStr];
        const isAbsent=calAbsent.has(dateStr);
        const isToday=dateStr===todayDateStr;
        const isWeekend=new Date(calYear,calMonthIdx,day).getDay()===0;
        const isFuture=dateStr>todayDateStr;

        let bg="transparent",color="var(--text)",border="1px solid transparent";
        if(isToday){border="2px solid var(--accent)";color="var(--accent)";}
        if(isFuture){color="var(--muted)";}
        else if(isWeekend&&!dayData){color="var(--muted)";}
        else if(dayData?.in&&dayData?.out){bg="#38d9a922";color="var(--gpa)";border="1px solid #38d9a944";}
        else if(dayData?.in&&!dayData?.out){bg="#4f8ef722";color="var(--accent)";border="1px solid #4f8ef744";}
        else if(isAbsent){bg="#ff5f6d22";color="var(--danger)";border="1px solid #ff5f6d44";}

        const cell=h("div",{style:{
          textAlign:"center",borderRadius:"8px",padding:".4rem .1rem",cursor:(dayData||isAbsent)?"pointer":"default",
          background:bg,border,color,fontSize:".85rem",fontWeight:isToday?"800":"600",
          transition:"all .15s",minHeight:"2.2rem",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"
        }},String(day));

        if(dayData?.in){
          const timeStr=fmtIST(dayData.in);
          cell.appendChild(h("div",{style:{fontSize:".55rem",color:"var(--accent2)",fontFamily:"var(--mono)",marginTop:"1px"}},timeStr));
        }

        if(dayData||isAbsent){
          cell.addEventListener("click",()=>{
            document.querySelectorAll(".cal-popup").forEach(p=>p.remove());
            const popup=el("div","cal-popup");
            popup.style.cssText=`position:fixed;inset:0;background:#00000088;display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem`;
            const box=h("div",{style:{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"16px",padding:"1.5rem",width:"100%",maxWidth:"320px",position:"relative"}});
            const closeBtn=h("button",{className:"x-btn"},"✕");closeBtn.addEventListener("click",()=>popup.remove());
            const dateLabel=new Date(calYear,calMonthIdx,day).toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
            box.appendChild(closeBtn);
            box.appendChild(h("div",{style:{fontSize:"1.1rem",fontWeight:"700",marginBottom:"1rem",paddingRight:"2rem"}},dateLabel));
            if(isAbsent&&!dayData?.in){
              box.appendChild(h("div",{style:{color:"var(--danger)",fontWeight:"700",fontSize:".9rem"}},"🔴 Absent"));
            } else {
              const rows=[
                ["Check In", dayData?.in?fmtIST(dayData.in):"—","var(--accent2)"],
                ["Check Out", dayData?.out?fmtIST(dayData.out):"—","var(--danger)"],
              ];
              rows.forEach(([lbl,val,col])=>{
                const row=h("div",{style:{display:"flex",justifyContent:"space-between",padding:".5rem 0",borderBottom:"1px solid var(--border)"}});
                row.appendChild(h("span",{style:{color:"var(--muted)",fontSize:".85rem"}},lbl));
                row.appendChild(h("span",{style:{color:col,fontFamily:"var(--mono)",fontWeight:"700",fontSize:".85rem"}},val));
                box.appendChild(row);
              });
              const survey=(DB.surveys||[]).find(s=>s.username===SESSION.username&&s.date===dateStr);
              if(survey){
                box.appendChild(h("div",{style:{marginTop:".8rem",fontSize:".78rem",fontWeight:"700",color:"var(--muted)",letterSpacing:".06em",textTransform:"uppercase"}},"Survey"));
                [["📜 Policy",survey.policy||0,"var(--policy)"],["🔐 RSA",survey.rsa||0,"var(--rsa)"],["🎓 GPA",survey.gpa||0,"var(--gpa)"]].forEach(([lbl,val,col])=>{
                  const row=h("div",{style:{display:"flex",justifyContent:"space-between",padding:".4rem 0",borderBottom:"1px solid var(--border)"}});
                  row.appendChild(h("span",{style:{color:"var(--muted)",fontSize:".85rem"}},lbl));
                  row.appendChild(h("span",{style:{color:col,fontFamily:"var(--mono)",fontWeight:"700",fontSize:".85rem"}},String(val)));
                  box.appendChild(row);
                });
              }
            }
            popup.appendChild(box);
            popup.addEventListener("click",e=>{if(e.target===popup)popup.remove();});
            document.body.appendChild(popup);
          });
          cell.addEventListener("mouseenter",()=>{if(dayData)cell.style.opacity=".8";});
          cell.addEventListener("mouseleave",()=>{cell.style.opacity="1";});
        }
        calGrid.appendChild(cell);
      }
      calWrap.appendChild(calGrid);

      const legend=h("div",{style:{display:"flex",gap:".75rem",flexWrap:"wrap",marginTop:"1rem",fontSize:".72rem"}});
      [["#38d9a922","#38d9a944","var(--gpa)","Full Day"],["#4f8ef722","#4f8ef744","var(--accent)","Checked In"],["#ff5f6d22","#ff5f6d44","var(--danger)","Absent"]].forEach(([bg,border,col,lbl])=>{
        const item=h("div",{style:{display:"flex",alignItems:"center",gap:".3rem"}});
        item.appendChild(h("span",{style:{width:"12px",height:"12px",borderRadius:"3px",background:bg,border:`1px solid ${border}`,display:"inline-block"}}));
        item.appendChild(h("span",{style:{color:"var(--muted)"}},lbl));
        legend.appendChild(item);
      });
      calWrap.appendChild(legend);
      content.appendChild(calWrap);
    }
  }
  refresh();render(dash);
}

// ── SURVEY EDIT MODAL ────────────────────────────────────────────────────────
function openSurveyEditModal(survey, onSave) {
  const ov=el("div","modal-overlay");
  const mo=el("div","modal",null,{maxWidth:"420px"});
  const xb=h("button",{className:"x-btn"},"✕");xb.addEventListener("click",()=>ov.remove());
  mo.appendChild(xb);
  mo.appendChild(h("div",{style:{fontSize:"1.5rem",marginBottom:".4rem"}},"✏️"));
  mo.appendChild(h("h2",{},"Edit Survey Entry"));
  const sub=el("div","sub","");
  sub.innerHTML=`User: <strong>${escapeHtml(survey.username)}</strong> &nbsp;·&nbsp; Date: <strong>${escapeHtml(survey.date)}</strong>`;
  mo.appendChild(sub);
  function numField(labelTxt, cls, val) {
    const wrap=h("div",{style:{marginBottom:"1.2rem"}});
    const ql=el("div","q-label "+cls,labelTxt);
    const inp=h("input",{type:"number",min:"0",value:val});
    inp.style.marginBottom="0";wrap.appendChild(ql);wrap.appendChild(inp);
    return {wrap,inp};
  }
  const {wrap:w1,inp:i1}=numField("📜 Policy Count","q-policy",survey.policy||0);
  const {wrap:w2,inp:i2}=numField("🔐 RSA Count","q-rsa",survey.rsa||0);
  const {wrap:w3,inp:i3}=numField("🎓 GPA Count","q-gpa",survey.gpa||0);
  const saveBtn=h("button",{className:"btn btn-primary",style:{marginTop:".5rem"}},"💾 Save Changes");
  saveBtn.addEventListener("click",async()=>{
    const idx=DB.surveys.findIndex(s=>s.id===survey.id);
    if(idx>=0){
      const updated={...DB.surveys[idx],policy:parseInt(i1.value)||0,rsa:parseInt(i2.value)||0,gpa:parseInt(i3.value)||0};
      saveBtn.disabled=true;saveBtn.textContent="Saving…";
      DB.surveys[idx]=updated;
      // Use updateSurvey (updates existing row by id) — addSurvey would append a duplicate
      await gsPost({action:"updateSurvey",data:updated});
    }
    ov.remove();onSave();
  });
  const delBtn=h("button",{className:"btn btn-danger",style:{marginTop:".6rem"}},"🗑 Delete This Entry");
  delBtn.addEventListener("click",async()=>{
    if(!confirm("Delete this survey entry?"))return;
    DB.surveys=DB.surveys.filter(s=>s.id!==survey.id);
    await gsPost({action:"deleteSurvey",data:{id:survey.id}});
    ov.remove();onSave();
  });
  const cancelBtn=h("button",{className:"btn btn-ghost",style:{marginTop:".6rem"}},"Cancel");
  cancelBtn.addEventListener("click",()=>ov.remove());
  [w1,w2,w3,saveBtn,delBtn,cancelBtn].forEach(x=>mo.appendChild(x));
  ov.appendChild(mo);document.body.appendChild(ov);
}

// ── USER DATA MODAL ───────────────────────────────────────────────────────────
function openUserDataModal(u, allAttend, allSurveys){
  const ov=el("div","modal-overlay");
  const mo=el("div","modal",null,{maxWidth:"560px"});
  const xb=h("button",{className:"x-btn"},"✕");xb.addEventListener("click",()=>ov.remove());
  mo.appendChild(xb);

  const displayName=(u.fullName&&u.fullName.trim())?u.fullName.trim():(u.username.charAt(0).toUpperCase()+u.username.slice(1).toLowerCase());
  const titleEl=h("h2",{},displayName);
  const subEl=h("div",{style:{color:"var(--muted)",fontSize:".82rem",marginBottom:"1.2rem",display:"flex",flexWrap:"wrap",gap:".5rem",alignItems:"center"}});
  subEl.appendChild(h("span",{style:{background:"#4f8ef722",color:"var(--accent)",border:"1px solid #4f8ef744",borderRadius:"6px",padding:".1rem .45rem",fontSize:".75rem",fontFamily:"var(--mono)"}},"ID: "+(u.userId||u.username)));
  if(u.designation)subEl.appendChild(h("span",{},"🏷 "+u.designation));
  if(u.location)subEl.appendChild(h("span",{},"📍 "+u.location));
  mo.appendChild(titleEl);mo.appendChild(subEl);

  const userAttend=allAttend.filter(r=>r.username===u.username).sort((a,b)=>b.timestamp-a.timestamp);

  const monthAbsences=(()=>{

      ...userAttend.filter(r=>r.type==="in").map(r=>localDateStr(new Date(r.timestamp))),

      const dateStr=curMon+"-"+String(d).padStart(2,"0");

      tbl.appendChild(thead);

        // Distance

        const tr=h("tr",{});

          <td class='attend-td'><span style='color:${depColor};font-weight:700;font-size:.78rem'>${dep?dep.label:"—"}</span></td>
          <td class='attend-td'>${_modalLocCell(inRec, inLoc, "var(--accent2)")}</td>
          <td class='attend-td'>${_modalLocCell(outRec, outLoc, "var(--danger)")}</td>`;
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      const wrap=h("div",{style:{overflowX:"auto",maxHeight:"360px",overflowY:"auto",borderRadius:"10px",border:"1px solid var(--border)"}});
      wrap.appendChild(tbl);tabBody.appendChild(wrap);

    } else if(modalTab==="surveys"){
      if(!userSurveys.length){tabBody.appendChild(el("div","empty","No survey entries found."));return;}
      const tbl=h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:".82rem"}});
      const thead=h("thead",{});
      thead.innerHTML="<tr><th class='attend-th'>Date</th><th class='attend-th'>📜 Policy</th><th class='attend-th'>🔐 RSA</th><th class='attend-th'>🎓 GPA</th></tr>";
      tbl.appendChild(thead);
      const tbody=h("tbody",{});
      userSurveys.forEach(s=>{
        const tr=h("tr",{});
        tr.innerHTML=`
          <td class='attend-td'>${s.date}</td>
          <td class='attend-td' style='color:var(--policy);font-weight:700;font-family:var(--mono)'>${parseInt(s.policy)||0}</td>
          <td class='attend-td' style='color:var(--rsa);font-weight:700;font-family:var(--mono)'>${parseInt(s.rsa)||0}</td>
          <td class='attend-td' style='color:var(--gpa);font-weight:700;font-family:var(--mono)'>${parseInt(s.gpa)||0}</td>`;
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      const wrap=h("div",{style:{overflowX:"auto",maxHeight:"360px",overflowY:"auto",borderRadius:"10px",border:"1px solid var(--border)"}});
      wrap.appendChild(tbl);tabBody.appendChild(wrap);

    } else if(modalTab==="absences"){
      // FIXED: Compute absent date list from attendance — same logic as monthAbsences count
      const computedAbsentDates=(()=>{
        // SERVER TIME FIX: use server time and IST for all date logic
        const todayStr=serverTodayStr();
        const todayISTDay=parseInt(todayStr.split("-")[2]);
        const year=parseInt(curMon.split("-")[0]);
        const month=parseInt(curMon.split("-")[1])-1;
        const daysInMonth=new Date(year,month+1,0).getDate();
        const lastDay=Math.min(daysInMonth,todayISTDay);
        const presentDates=new Set([
          ...userAttend.filter(r=>r.type==="in").map(r=>localDateStr(new Date(r.timestamp))),
          ...userSurveys.map(s=>s.date)
        ]);
        const dates=[];
        for(let d=1;d<=lastDay;d++){
          const dateStr=curMon+"-"+String(d).padStart(2,"0");
          const dow=new Date(dateStr+"T00:00:00+05:30").getDay(); // IST day-of-week
          if(dow===0)continue;
          if(dateStr===todayStr)continue; // skip today
          if(!presentDates.has(dateStr))dates.push(dateStr);
        }
        return dates.reverse(); // most recent first
      })();
      if(!computedAbsentDates.length){tabBody.appendChild(el("div","empty","No absences recorded."));return;}
      const tbl=h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:".82rem"}});
      const thead=h("thead",{});
      thead.innerHTML="<tr><th class='attend-th'>Date</th><th class='attend-th'>Type</th></tr>";
      tbl.appendChild(thead);
      const tbody=h("tbody",{});
      computedAbsentDates.forEach(dateStr=>{
        const tr=h("tr",{});
        tr.innerHTML=`
          <td class='attend-td'>${dateStr}</td>
          <td class='attend-td'><span style='color:var(--danger);font-weight:700;font-size:.78rem'>🔴 Absent</span></td>`;

  syncUserBtn.addEventListener("click",async()=>{

    await loadFromSheet();
    syncUserBtn.textContent="Done!";

// ── ADMIN DASH ────────────────────────────────────────────────────────────────
function renderAdmin(){
  if(!SESSION||!SESSION.username){renderLogin();return;}
  let curTab="users";
