  adminThemeBtn.title="Toggle light/dark mode";
  adminThemeBtn.addEventListener("click",()=>{
    const isLight=document.body.classList.toggle("light-mode");
    adminThemeBtn.textContent=isLight?"🌙":"☀️";
    localStorage.setItem("vibeTheme",isLight?"light":"dark");
  });
  hdrR.appendChild(adminThemeBtn);
  if(window._adminBadgeInterval) clearInterval(window._adminBadgeInterval);
  window._adminBadgeInterval=null;
  hdrR.appendChild(soBtn);hdr.appendChild(hdrR);dash.appendChild(hdr);

  const content=el("div","content");dash.appendChild(content);

  // RATE LIMIT FIX: poll every 3 min during work hours, 5 min otherwise
  // (was 6s/15s — caused 600+ calls/hour hitting Google rate limit)
  function getAdminPollMs(){
    const t=new Date(),tot=t.getHours()*60+t.getMinutes();
    return (tot>=480 && tot<=660) ? 3*60*1000 : 5*60*1000;
  }

  let _adminSyncing=false;
  let _lastSyncOk=true;
  let _lastSyncTime=null;
  let _failCount=0; // exponential backoff counter
  async function doAdminSync(force){
    if(_adminSyncing && !force) return;
    // Exponential backoff: if last N syncs failed, wait longer before retrying
    if(!force && _failCount>0){
      const backoffMs=Math.min(_failCount*60*1000, 10*60*1000); // max 10 min backoff
      if(_lastSyncTime && (Date.now()-_lastSyncTime.getTime()) < backoffMs) return;
    }
    _adminSyncing=true;
    try{
      const ok=await loadFromSheet();
      _lastSyncOk=!!ok;
      if(ok){ _lastSyncTime=new Date(); _failCount=0; }
      else { _failCount=Math.min(_failCount+1,10); }
      const u2=DB.users.find(x=>x.username===SESSION?.username);
      if(u2?.fullName?.trim()) SESSION.fullName=u2.fullName.trim();
      if(SESSION) try{if(typeof window._adminRefresh==="function")window._adminRefresh();}catch(_){}
    }finally{ _adminSyncing=false; }
  }

  if(window._adminPollInterval){clearInterval(window._adminPollInterval);window._adminPollInterval=null;}
  if(window._adminPollTimeout){clearTimeout(window._adminPollTimeout);window._adminPollTimeout=null;}

  let _pollMs=getAdminPollMs();
  function startAdminPoll(){
    if(window._adminPollInterval) clearInterval(window._adminPollInterval);
    _pollMs=getAdminPollMs();
    window._adminPollInterval=setInterval(async()=>{
      if(!SESSION||SESSION.role!=="admin"){clearInterval(window._adminPollInterval);return;}
      const newMs=getAdminPollMs();
      if(newMs!==_pollMs){clearInterval(window._adminPollInterval);startAdminPoll();return;}
      await doAdminSync(false);
    }, _pollMs);
  }

  // Show cached data immediately, then refresh after sheet sync completes
  if(DB.attendance.length||DB.surveys.length||DB.users.length>1){ refresh(); }
  else { content.innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);font-family:var(--font);font-size:.95rem">⏳ Loading data from Google Sheets…</div>'; }
  (async()=>{ await doAdminSync(true); refresh(); startAdminPoll(); })();
  window._doAdminSync = doAdminSync;

  soBtn.addEventListener("click",()=>{
    if(window._adminPollInterval){clearInterval(window._adminPollInterval);window._adminPollInterval=null;}
    window._adminRefresh=null; window._doAdminSync=null;
    if(autoSyncInterval){clearInterval(autoSyncInterval);autoSyncInterval=null;}
    delete window._recQuick;delete window._recUser;delete window._recMonth;
    delete window._adminGeoLat;delete window._adminGeoLng;
    delete window._surveyShowAll;delete window._userSearch;
    delete window._userSearch;delete window._geoWarn;
    SESSION=null;clearSession();route();
  });

  function refresh(){
    window._adminRefresh=refresh;
    content.innerHTML="";
    // SYNC STATUS BANNER
    if(!_lastSyncOk){
      const syncBanner=h("div",{style:{background:"#fee2e2",border:"1.5px solid #fca5a5",borderRadius:"12px",padding:".75rem 1.1rem",marginBottom:"1rem",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"1rem",flexWrap:"wrap"}});
      const syncMsg=h("span",{style:{fontSize:".85rem",color:"#991b1b",fontWeight:"600"}},"\u26a0\ufe0f Could not load data from Google Sheets. Showing last known data.");
      const retryBtn=h("button",{style:{padding:".35rem .9rem",borderRadius:"8px",border:"1.5px solid #f87171",background:"#fff",color:"#dc2626",fontFamily:"var(--font)",fontSize:".8rem",fontWeight:"700",cursor:"pointer",whiteSpace:"nowrap"}},"\ud83d\udd04 Retry");
      retryBtn.addEventListener("click",async()=>{retryBtn.disabled=true;retryBtn.textContent="Syncing...";await doAdminSync(true);});
      syncBanner.appendChild(syncMsg);syncBanner.appendChild(retryBtn);
      content.appendChild(syncBanner);
    } else if(_lastSyncTime){
      const syncBar=h("div",{style:{fontSize:".72rem",color:"var(--muted)",textAlign:"right",marginBottom:".5rem",paddingRight:".25rem"}},"\u2705 Synced at "+_lastSyncTime.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"}));
      content.appendChild(syncBar);
    }
    const regularUsers=DB.users.filter(u=>u.role!=="admin");
    let allAttend = [...DB.attendance].sort((a,b)=>b.timestamp-a.timestamp);

    const _adByUD = {};
    allAttend.forEach(r => {
      const dk = r.username+"__"+localDateStr(new Date(r.timestamp));
      if(!_adByUD[dk]) _adByUD[dk] = [];
      _adByUD[dk].push(r);
    });
    const allSurveys = [...(DB.surveys||[])];
    const todayStr=localDateStr();
    function normDate(d){if(!d)return"";const s=String(d);return s.includes("T")?s.slice(0,10):s.slice(0,10);}
    const todaySurveys=allSurveys.filter(s=>normDate(s.date)===todayStr);
    const todayLocalStr = todayStr;
    const todayInUsers=[...new Set(
      allAttend
        .filter(r=>(r.type==="in"||r.type==="out") && localDateStr(new Date(r.timestamp))===todayLocalStr)
        .map(r=>r.username)
    )];
    // SERVER TIME FIX: use server IST day-of-week
const todayIsWeekend=new Date(serverTodayStr()+"T00:00:00+05:30").getDay()===0;
    const todaySurveyUsernames=new Set(todaySurveys.map(s=>s.username));

    const totalPolicy=thisMonthSurveys.reduce((s,r)=>s+(parseInt(r.policy)||0),0);

    const homeGrid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:"1rem",margin:"1.5rem 0 .8rem"},className:"home-cards"});
    function makePillList(names, bg, col, emptyMsg) {

    const mapIframe=h("iframe",{
      src:_hasLocation?buildMapUrl(_mapLat,_mapLng):"about:blank",
      style:{width:"100%",height:"100%",border:"none"},
      allowfullscreen:"",
      loading:"lazy"
    });
    if(!_hasLocation){
      mapIframe.style.display="none";
      const mapPlaceholder=h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:".5rem",color:"var(--muted)",fontSize:".85rem"}});
      mapPlaceholder.innerHTML="🗺️<br><span>Search or enter coordinates<br>to set office location</span>";
      mapPlaceholder.style.textAlign="center";
      mapWrap.appendChild(mapPlaceholder);
    }
    mapWrap.appendChild(mapIframe);
    rightCol.appendChild(mapWrap);

    // ── SMART PASTE INPUT ─────────────────────────────────────────────────────
    // Accepts ANY Google Maps format:
    //   • https://maps.google.com/?q=13.0827,80.2707
    //   • https://www.google.com/maps/place/.../@13.0827,80.2707,17z/...
    //   • https://maps.app.goo.gl/xxxx  (short link — shown as hint)
    //   • 13.0827, 80.2707  (plain coords)
    //   • 13.0827 80.2707   (space-separated)
    //   • 13°04'57.7"N 80°16'13.7"E  (DMS format)
    function parseGoogleMapsInput(raw){
      const s=raw.trim();
      // 1. @lat,lng in URL (most Google Maps share URLs)
      let m=s.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);
      if(m)return{lat:parseFloat(m[1]),lng:parseFloat(m[2])};
      // 2. ?q=lat,lng
      m=s.match(/[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
      if(m)return{lat:parseFloat(m[1]),lng:parseFloat(m[2])};
      // 3. /place/.../lat,lng (some share URLs)
      m=s.match(/place\/[^/]+\/(-?\d+\.?\d*),(-?\d+\.?\d*)/);
      if(m)return{lat:parseFloat(m[1]),lng:parseFloat(m[2])};
      // 4. ll=lat,lng
      m=s.match(/ll=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
      if(m)return{lat:parseFloat(m[1]),lng:parseFloat(m[2])};
      // 5. Plain "lat, lng" or "lat lng"
      m=s.match(/^(-?\d+\.?\d*)[,\s]+(-?\d+\.?\d*)$/);
      if(m)return{lat:parseFloat(m[1]),lng:parseFloat(m[2])};
      // 6. DMS: 13°04'57.7"N 80°16'13.7"E
      m=s.match(/(\d+)°(\d+)'([\d.]+)"([NS])\s+(\d+)°(\d+)'([\d.]+)"([EW])/);
      if(m){
        const lat=(parseInt(m[1])+parseInt(m[2])/60+parseFloat(m[3])/3600)*(m[4]==="S"?-1:1);
        const lng=(parseInt(m[5])+parseInt(m[6])/60+parseFloat(m[7])/3600)*(m[8]==="W"?-1:1);
        return{lat,lng};
      }
      return null;
    }

    const pasteWrap=h("div",{style:{marginBottom:".65rem"}});
    const pasteLbl=h("div",{style:{fontSize:".7rem",color:"var(--muted)",fontWeight:"700",letterSpacing:".06em",textTransform:"uppercase",marginBottom:".3rem",display:"flex",alignItems:"center",gap:".4rem"}});
    pasteLbl.innerHTML='📋 Paste Google Maps Link or Coordinates';
    const pasteRow=h("div",{style:{display:"flex",gap:".4rem"}});
    const pasteInp=h("input",{type:"text",placeholder:"Paste Maps URL or 13.0827, 80.2707 …"});
    pasteInp.style.cssText="flex:1;padding:.6rem .9rem;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--mono);font-size:.8rem;outline:none;box-sizing:border-box;min-width:0";
    const pasteBtn=h("button",{type:"button",style:{padding:".6rem .9rem",borderRadius:"8px",border:"none",background:"var(--accent)",color:"#fff",fontFamily:"var(--font)",fontSize:".8rem",fontWeight:"700",cursor:"pointer",whiteSpace:"nowrap",flexShrink:"0"}},"Set");

    const pasteFeedback=h("div",{style:{fontSize:".75rem",marginTop:".3rem",minHeight:"1rem"}});

    function applyPaste(){
      const result=parseGoogleMapsInput(pasteInp.value);
      if(result&&result.lat>=-90&&result.lat<=90&&result.lng>=-180&&result.lng<=180){
        iLat.value=result.lat.toFixed(6);
        iLng.value=result.lng.toFixed(6);
        updateMap(result.lat,result.lng);
        pasteFeedback.style.color="var(--accent2)";
        pasteFeedback.textContent="✅ Coordinates set: "+result.lat.toFixed(5)+", "+result.lng.toFixed(5);
        pasteInp.style.borderColor="var(--accent2)";
        setTimeout(()=>{pasteInp.value="";pasteInp.style.borderColor="var(--border)";pasteFeedback.textContent="";},3000);
      } else if(pasteInp.value.trim().includes("goo.gl")||pasteInp.value.trim().includes("maps.app")){
        // Short link — can't resolve client-side, show hint
        pasteFeedback.style.color="var(--warn)";
        pasteFeedback.textContent="⚠️ Short link detected. Open in Maps → Share → Copy full link.";
        pasteInp.style.borderColor="var(--warn)";
      } else if(pasteInp.value.trim()){
        pasteFeedback.style.color="var(--danger)";
        pasteFeedback.textContent="❌ Not recognised. Try: 13.0827, 80.2707 or paste a full Maps URL.";
        pasteInp.style.borderColor="var(--danger)";
        setTimeout(()=>{pasteInp.style.borderColor="var(--border)";pasteFeedback.textContent="";},3000);
      }
    }
    pasteBtn.addEventListener("click",applyPaste);
    // Auto-parse on paste event (instant, no need to click Set)
    pasteInp.addEventListener("paste",e=>{
      setTimeout(()=>applyPaste(),50); // wait for value to populate
    });
    pasteInp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();applyPaste();}});
    pasteRow.appendChild(pasteInp);pasteRow.appendChild(pasteBtn);
    pasteWrap.appendChild(pasteLbl);pasteWrap.appendChild(pasteRow);pasteWrap.appendChild(pasteFeedback);
    rightCol.appendChild(pasteWrap);

    // Search address input
    const searchWrap=h("div",{style:{position:"relative",marginBottom:".65rem"}});
    const searchAddr=h("input",{type:"text",placeholder:"🔍 Search address (e.g. Anna Nagar Chennai)…"});
    searchAddr.style.cssText="width:100%;padding:.65rem .9rem;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font);font-size:.83rem;outline:none;box-sizing:border-box";
    const searchBtn=h("button",{type:"button",style:{position:"absolute",right:".4rem",top:"50%",transform:"translateY(-50%)",background:"var(--accent)",color:"#fff",border:"none",borderRadius:"6px",padding:".3rem .7rem",fontFamily:"var(--font)",fontSize:".75rem",fontWeight:"700",cursor:"pointer"}},"Search");
    searchWrap.appendChild(searchAddr);searchWrap.appendChild(searchBtn);
    rightCol.appendChild(searchWrap);

    // Manual lat/lng inputs
    const coordRow=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:".5rem",marginBottom:".65rem"}});
    const latWrap=h("div",{style:{position:"relative"}});
    const lngWrap=h("div",{style:{position:"relative"}});
    const latLbl=h("label",{style:{fontSize:".7rem",color:"var(--muted)",fontWeight:"700",letterSpacing:".06em",textTransform:"uppercase",display:"block",marginBottom:".25rem"}},"Latitude");
    const lngLbl=h("label",{style:{fontSize:".7rem",color:"var(--muted)",fontWeight:"700",letterSpacing:".06em",textTransform:"uppercase",display:"block",marginBottom:".25rem"}},"Longitude");
    const iLat=h("input",{type:"number",step:"0.0001",placeholder:"e.g. 13.0827",value:u.geoLat||""});
    const iLng=h("input",{type:"number",step:"0.0001",placeholder:"e.g. 80.2707",value:u.geoLng||""});
    iLat.style.cssText=iLng.style.cssText="width:100%;padding:.55rem .75rem;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--mono);font-size:.82rem;outline:none;box-sizing:border-box;margin:0";
    latWrap.appendChild(latLbl);latWrap.appendChild(iLat);
    lngWrap.appendChild(lngLbl);lngWrap.appendChild(iLng);
    coordRow.appendChild(latWrap);coordRow.appendChild(lngWrap);
    rightCol.appendChild(coordRow);

    // Radius + Use My Location row
    const radiusRow=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:".5rem",marginBottom:".65rem"}});
    const radWrap=h("div",{});
    const radLbl=h("label",{style:{fontSize:".7rem",color:"var(--muted)",fontWeight:"700",letterSpacing:".06em",textTransform:"uppercase",display:"block",marginBottom:".25rem"}},"Radius (metres)");
    const _cleanRadius=(u.geoRadius&&parseInt(u.geoRadius)>=50&&parseInt(u.geoRadius)<=5000)?parseInt(u.geoRadius):200;
const iRad=h("input",{type:"number",min:"50",max:"5000",value:_cleanRadius,placeholder:"200"});
    iRad.style.cssText="width:100%;padding:.55rem .75rem;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--mono);font-size:.82rem;outline:none;box-sizing:border-box;margin:0";
    radWrap.appendChild(radLbl);radWrap.appendChild(iRad);

    const myLocWrap=h("div",{style:{display:"flex",alignItems:"flex-end",paddingBottom:"1px"}});
    const myLocBtn=h("button",{type:"button",style:{width:"100%",padding:".55rem .5rem",borderRadius:"8px",border:"1.5px solid var(--accent)",background:"transparent",color:"var(--accent)",fontFamily:"var(--font)",fontSize:".78rem",fontWeight:"700",cursor:"pointer"}});
    myLocBtn.innerHTML="📡 Use My Location";
    myLocWrap.appendChild(myLocBtn);
    radiusRow.appendChild(radWrap);radiusRow.appendChild(myLocWrap);
    rightCol.appendChild(radiusRow);

    // Clear location button
    const clearLocBtn=h("button",{type:"button",style:{width:"100%",padding:".45rem",borderRadius:"8px",border:"1.5px solid #ff5f6d44",background:"transparent",color:"var(--danger)",fontFamily:"var(--font)",fontSize:".78rem",fontWeight:"700",cursor:"pointer",marginBottom:".5rem"}});
    clearLocBtn.innerHTML="🗑 Clear Location (disable geofence)";
    rightCol.appendChild(clearLocBtn);

    // ── MAP UPDATE HELPER ─────────────────────────────────────────────────────
    function updateMap(lat,lng){
      _mapLat=lat;_mapLng=lng;_hasLocation=true;
      mapIframe.src=buildMapUrl(lat,lng);
      mapIframe.style.display="block";
      const ph=mapWrap.querySelector("div");if(ph)ph.remove();
      geoStatus.textContent=`✅ Location set — ${parseFloat(lat).toFixed(4)}, ${parseFloat(lng).toFixed(4)} (${iRad.value||200}m radius)`;
      geoStatus.style.background="#38d9a922";geoStatus.style.color="var(--accent2)";geoStatus.style.border="1px solid #38d9a944";
    }

    // ── SEARCH ADDRESS ────────────────────────────────────────────────────────
    async function doSearch(){
      const q=searchAddr.value.trim();
      if(!q)return;
      searchBtn.textContent="…";searchBtn.disabled=true;
      try{
        const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`,{headers:{"Accept-Language":"en"}});
        const json=await res.json();
        if(json&&json.length){
          const lat=parseFloat(json[0].lat),lng=parseFloat(json[0].lon);
          iLat.value=lat.toFixed(6);iLng.value=lng.toFixed(6);
          updateMap(lat,lng);
        } else {
          showModalErr("Address not found. Try a more specific address.");
        }
      }catch(e){showModalErr("Search failed. Enter coordinates manually.");}
      searchBtn.textContent="Search";searchBtn.disabled=false;
    }
    searchBtn.addEventListener("click",doSearch);
    searchAddr.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doSearch();}});

    // ── MANUAL COORD INPUT ────────────────────────────────────────────────────
    function onCoordInput(){
      const lat=parseFloat(iLat.value),lng=parseFloat(iLng.value);
      if(!isNaN(lat)&&!isNaN(lng)&&lat>=-90&&lat<=90&&lng>=-180&&lng<=180){
        updateMap(lat,lng);
      }
    }
    iLat.addEventListener("change",onCoordInput);
    iLng.addEventListener("change",onCoordInput);
    iRad.addEventListener("input",()=>{
      if(_hasLocation) geoStatus.textContent=`✅ Location set — ${parseFloat(_mapLat).toFixed(4)}, ${parseFloat(_mapLng).toFixed(4)} (${iRad.value||200}m radius)`;
    });

    // ── USE MY LOCATION ───────────────────────────────────────────────────────
    myLocBtn.addEventListener("click",()=>{
      myLocBtn.innerHTML="📡 Getting…";myLocBtn.disabled=true;
      navigator.geolocation.getCurrentPosition(p=>{
        const lat=p.coords.latitude,lng=p.coords.longitude;
        iLat.value=lat.toFixed(6);iLng.value=lng.toFixed(6);
        updateMap(lat,lng);
        myLocBtn.innerHTML="📡 Use My Location";myLocBtn.disabled=false;
      },()=>{
        showModalErr("Could not get location. Allow permission in your browser.");
        myLocBtn.innerHTML="📡 Use My Location";myLocBtn.disabled=false;
      },{timeout:10000,enableHighAccuracy:true});
    });

    // ── CLEAR LOCATION ────────────────────────────────────────────────────────
    clearLocBtn.addEventListener("click",()=>{
      iLat.value="";iLng.value="";_hasLocation=false;
      mapIframe.src="about:blank";mapIframe.style.display="none";
      if(!mapWrap.querySelector("div[style]")){
        const ph=h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:".5rem",color:"var(--muted)",fontSize:".85rem",textAlign:"center"}});
        ph.innerHTML="🗺️<br><span>Search or enter coordinates</span>";
        mapWrap.insertBefore(ph,mapIframe);
      }
      geoStatus.textContent="⚠️ No location set — geofence check disabled";
      geoStatus.style.background="#ffd16622";geoStatus.style.color="var(--warn)";geoStatus.style.border="1px solid #ffd16644";
    });

    grid.appendChild(leftCol);grid.appendChild(rightCol);
    mo.appendChild(modalErrBox);
    mo.appendChild(grid);

    // ── SAVE ──────────────────────────────────────────────────────────────────
    // ✅ FIX #9: Cleanup function for map iframe (prevent memory leak)
    const cleanupMap = () => {
      if(mapIframe && mapIframe.parentNode) {
        mapIframe.remove();
      }
    };
    
    const sb=h("button",{className:"btn btn-primary",style:{marginTop:".25rem"}},"💾 Save Changes");
    sb.addEventListener("click",()=>{
      const name=iName.value.trim(),uid=iUID.value.trim().toLowerCase().replace(/\s+/g,""),pw=iPW.value.trim();
      const des=iDS.value.trim(),loc=iLoc.value.trim(),offName=iOfficeName.value.trim();
      const lat=iLat.value.trim(),lng=iLng.value.trim();
      const rad=parseInt(iRad.value)||200;
      if(!name){showModalErr("Full name is required.");return;}
      if(!uid||!pw){showModalErr("User ID and password are required.");return;}
      if(pw.length<4){showModalErr("Password must be at least 4 characters.");return;}
      // ✅ FIX #5: Validate username format (alphanumeric + underscore only)
      if(!/^[a-z0-9_]{3,}$/.test(uid)){showModalErr("User ID must be 3+ characters, lowercase letters/numbers/underscore only.");return;}
      if(uid!==u.username&&DB.users.find(x=>x.username===uid)){showModalErr("User ID already exists.");return;}
      if(lat&&(isNaN(parseFloat(lat))||parseFloat(lat)<-90||parseFloat(lat)>90)){showModalErr("Invalid latitude (must be -90 to 90).");return;}
      if(lng&&(isNaN(parseFloat(lng))||parseFloat(lng)<-180||parseFloat(lng)>180)){showModalErr("Invalid longitude (must be -180 to 180).");return;}
      const idx=DB.users.findIndex(x=>x.username===u.username);
      // Hash the new password, but preserve existing hash if admin typed the same value back
      (async()=>{
        const existingPw=DB.users[idx]?.password||"";
        let finalPw;
        if(existingPw.startsWith("sha256:")){
          // Admin may have left the field showing a hash — re-hash only if it looks like plaintext
          finalPw = pw.startsWith("sha256:") ? pw : await hashPassword(pw);
        } else {
          finalPw = await hashPassword(pw);
        }
        DB.users[idx]={
          ...DB.users[idx],
          username:uid,password:finalPw,fullName:name,userId:uid,
          designation:des,location:loc,officeName:offName,
          geoLat:lat||"",geoLng:lng||"",geoRadius:rad,
        };
        if(uid!==u.username){
          DB.attendance=DB.attendance.map(r=>r.username===u.username?{...r,username:uid}:r);
          DB.surveys=(DB.surveys||[]).map(s=>s.username===u.username?{...s,username:uid}:s);
          DB.absences=(DB.absences||[]).map(a=>a.username===u.username?{...a,username:uid}:a);
        }
        save(DB);
        try{
          await syncSingleUserToSheet(DB.users[idx]);
          showToast(`✅ ${escapeHtml(name)} updated — geofence ${lat&&lng?"set to "+rad+"m":"disabled"}.`,"success",4000);
        }catch(e){
          console.error("Sync failed:",e);
          showToast(`⚠️ ${escapeHtml(name)} saved locally but sync failed. Check connection.`,"warn",5000);
        }
        cleanupMap();
        ov.remove();refresh();
      })();
    });
    const cb=h("button",{className:"btn btn-ghost",style:{marginTop:".5rem"}},"Cancel");
    cb.addEventListener("click",()=>{
      cleanupMap();  // ✅ FIX #9: Remove map iframe
      ov.remove();
    });
    mo.appendChild(sb);mo.appendChild(cb);
    ov.appendChild(mo);document.body.appendChild(ov);
  }

  refresh();render(dash);
}

(function cleanEarlyAbsences(){
  const now = new Date();
  if (now.getDay() === 0) return;
  if (!DB || !DB.users || !DB.users.length) return;
  // IST FIX: compute current time in IST
  const _istNowMin=Math.floor((now.getTime()/60000)+(5*60+30));
  const nowMin=(((_istNowMin%1440)+1440)%1440);
  const startMin = WORK_START_H * 60 + WORK_START_M;
  if (nowMin < startMin) {
    const todayStr = localDateStr(now);
    DB.absences = (DB.absences || []).filter(a => !(a.date === todayStr && a.auto === true));
  }
})();
